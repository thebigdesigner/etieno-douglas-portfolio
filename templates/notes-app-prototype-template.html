<!doctype html>
<html lang="en" style="color-scheme:light">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FFFFFF">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your App — notes that listen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{
  /* Spring palette accents */
  --canyon:#DF6D41;--canyon-deep:#A3421C;--canyon-light:#EE9C78;--canyon-soft:#FBE4D9;
  --butter:#F7D89A;--butter-deep:#7A5C16;--butter-light:#FBE6BD;--butter-soft:#FDF3DD;
  --sky:#8DA6CC;--sky-deep:#415A8C;--sky-light:#BCCBE2;--sky-soft:#E8EEF7;
  --olive:#AAA648;--olive-deep:#6F6C25;--olive-light:#CFCC8E;--olive-soft:#EFEED9;
  /* Light theme: white-led, blue primary */
  --desk:#E8ECF2;
  --bg:#FFFFFF;--bg-rgb:255,255,255;
  --surface:#FFFFFF;--surface-rgb:255,255,255;
  --soft:#F3F5F9;--soft2:#E9EDF3;--line:#E4E8EF;
  --ink:#171B22;--ink-rgb:23,27,34;--ink2:#3E4553;--muted:#636B79;--faint:#AEB5C1;
  --brand:#8DA6CC;--brand-deep:#415A8C;--brand-soft:#E8EEF7;--brand-softer:#F3F6FB;--brand-line:#B9C9E2;--on-brand:#FFFFFF;
  --grad-a:#4F6A9E;--grad-b:#3A5282;--brand-rgb:65,90,140;
  --shadow-rgb:28,40,64;--scrim-rgb:15,20,30;
  --switch-off:#D6DCE5;--ink-card:#1D222B;--on-dark:#FFFFFF;
  --cap-a:#FFF6E2;--cap-b:#F7D89A;--cap2-a:#EEF3FA;--cap2-b:#C9D6EA;
  --voice-a:#FFFFFF;--voice-b:#EEF3FA;--voice-c:#E1E9F4;
  --verse-a:#F3F6FB;--verse-b:#FAFBFD;--up-a:#F3F6FB;--up-b:#FFF6E2;
  --pink:#DF6D41;--yellow:#F7D89A;--orange:#DF6D41;--teal:#AAA648;--blue:#8DA6CC;--red:#C23B2E;--green:#5F7A2E;
  --pad:clamp(16px,5.2vw,24px);
  --r-xl:clamp(24px,7vw,32px);--r-lg:22px;--r-md:18px;--r-sm:14px;
  --nav-h:calc(84px + env(safe-area-inset-bottom));
  --shadow:0 18px 36px -24px rgba(var(--shadow-rgb),.40);
  --shadow-sm:0 8px 22px -14px rgba(var(--shadow-rgb),.30);
  --serif:"Playfair Display",Georgia,serif;
  --read:"Newsreader",Georgia,serif;
  /* Keep note colours */
  --k-default:var(--surface);--k-coral:#F9D3C2;--k-peach:#F4B797;--k-sand:#FCEBC4;--k-mint:#EEEFD8;--k-sage:#DCDDB0;--k-fog:#E8EEF7;--k-storm:#C9D6EA;--k-dusk:#EADDD3;--k-blossom:#FBE4D9;--k-clay:#EFE8DC;--k-chalk:#F3F5F9;
}
/* Dark theme: soft black */
html[data-theme="dark"]{
  --desk:#121212;
  --bg:#1E1E1E;--bg-rgb:30,30,30;
  --surface:#272727;--surface-rgb:39,39,39;
  --soft:#303030;--soft2:#393939;--line:#383838;
  --ink:#F0F0F0;--ink-rgb:240,240,240;--ink2:#D2D2D2;--muted:#A6A6A6;--faint:#6B6B6B;
  --sky-soft:#2B3340;
  --shadow-rgb:0,0,0;--scrim-rgb:0,0,0;
  --switch-off:#4A4A4A;--ink-card:#333333;
  --cap-a:#3A3326;--cap-b:#4A3F29;--cap2-a:#2D3440;--cap2-b:#35404F;
  --voice-a:#1E1E1E;--voice-b:#232830;--voice-c:#262C36;
  --verse-a:#2B3038;--verse-b:#282A2E;--up-a:#2B3038;--up-b:#35302A;
  --red:#F07A6C;--green:#B9C77A;
  --k-coral:#4A3129;--k-peach:#523526;--k-sand:#4A4230;--k-mint:#393B2B;--k-sage:#3D402A;--k-fog:#2E3642;--k-storm:#344157;--k-dusk:#433832;--k-blossom:#45312A;--k-clay:#3D3730;--k-chalk:#333333;
  color-scheme:dark;
}
html{color-scheme:light}
.tint{background:var(--tint)}
html[data-theme="dark"] .tint{background:color-mix(in srgb,var(--tint) 14%,var(--surface))}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--desk);color:var(--ink);font-family:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;text-align:inherit}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:10px}
a{color:inherit}
svg{display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Device shell ---------- */
.app{position:relative;width:100%;height:100vh;height:100dvh;overflow:hidden;background:var(--bg);isolation:isolate}
@media (min-width:600px) and (min-height:760px){
  body{padding:24px}
  .app{width:400px;height:min(860px,calc(100dvh - 48px));border-radius:54px;box-shadow:0 0 0 10px var(--surface),0 0 0 11px var(--line),0 50px 90px -40px rgba(var(--shadow-rgb),.38)}
}
#stage{position:absolute;inset:0}
.page{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none;background:var(--bg);animation:pageIn .38s cubic-bezier(.2,.8,.2,1)}
.page::-webkit-scrollbar{display:none}
.page.with-nav{padding-bottom:calc(var(--nav-h) + 24px)}
.page.back-anim{animation:pageBack .38s cubic-bezier(.2,.8,.2,1)}
@keyframes pageIn{from{opacity:0;transform:translateX(24px)}}
@keyframes pageBack{from{opacity:0;transform:translateX(-24px)}}
.page.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- Common ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(env(safe-area-inset-top) + 16px) var(--pad) 0}
.top .grow{flex:1;min-width:0}
.ibtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--surface);box-shadow:var(--shadow-sm);position:relative}
.ibtn.flat{background:transparent;box-shadow:none}
.ibtn.glass{background:rgba(var(--surface-rgb),.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.ibtn svg{width:21px;height:21px}
.ibtn .dot{position:absolute;top:10px;right:11px;width:8px;height:8px;border-radius:50%;background:var(--pink);border:2px solid var(--surface)}
.avatar{overflow:hidden;padding:0;width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;color:var(--ink2);font-weight:600;font-size:15px;background:var(--soft);box-shadow:var(--shadow-sm)}
.avatar.sm{width:32px;height:32px;font-size:12px}
.avatar.xs{width:26px;height:26px;font-size:10px;box-shadow:none;border:2px solid var(--surface)}
.hello{font-size:15px;color:var(--muted);margin-top:22px;padding:0 var(--pad)}
.serif{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;line-height:1.14}
.h1{font-family:var(--serif);font-size:clamp(30px,9vw,38px);font-weight:600;line-height:1.12;padding:6px var(--pad) 0;letter-spacing:-.01em}
.h2{font-size:clamp(19px,5.4vw,21px);font-weight:600;letter-spacing:-.015em}
.sec{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 var(--pad);margin-top:28px}
.link{color:var(--brand-deep);font-size:14px;font-weight:500;padding:10px 0;min-height:40px;display:inline-flex;align-items:center}
.muted{color:var(--muted)}
.row-scroll{display:flex;gap:12px;overflow-x:auto;padding:14px var(--pad) 6px;scroll-snap-type:x mandatory;scroll-padding:0 var(--pad);scrollbar-width:none}
.row-scroll::-webkit-scrollbar{display:none}
.row-scroll>*{scroll-snap-align:start;flex:none}

.tabs{display:flex;align-items:center;gap:clamp(16px,5vw,26px);padding:0 var(--pad);margin-top:20px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;flex:none;font-size:15px;color:var(--faint);padding:10px 2px 12px;min-width:32px;text-align:center;white-space:nowrap;font-weight:500;transition:color .2s}
.tab[aria-selected="true"]{color:var(--brand-deep)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:50%;bottom:2px;width:5px;height:5px;border-radius:50%;background:var(--brand);transform:translateX(-50%)}
.tabs .end{margin-left:auto;flex:none}

.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:99px;background:var(--soft);font-size:13.5px;font-weight:500;color:var(--ink2);white-space:nowrap;border:1px solid transparent}
.chip svg{width:15px;height:15px}
.chip[aria-pressed="true"],.chip.on{background:var(--brand-soft);color:var(--brand-deep);border-color:var(--brand-line)}
.chips{display:flex;flex-wrap:wrap;gap:8px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:54px;padding:0 22px;border-radius:99px;font-size:16px;font-weight:500;white-space:nowrap}
.btn svg{width:19px;height:19px}
.btn.primary{background:linear-gradient(100deg,var(--grad-a),var(--grad-b));color:var(--on-brand);box-shadow:0 16px 28px -14px rgba(var(--brand-rgb),.55)}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.soft{background:var(--brand-soft);color:var(--brand-deep)}
.btn.line{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.btn.block{width:100%}
.btn.sm{height:40px;padding:0 16px;font-size:14px}
.btn[disabled]{opacity:.55;pointer-events:none}

.field{display:block;margin-top:14px}
.field span{display:block;font-size:13px;color:var(--muted);margin:0 0 6px 4px}
.input{display:flex;align-items:center;gap:10px;height:54px;padding:0 16px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);transition:border-color .2s,box-shadow .2s}
.input:focus-within{border-color:var(--brand-line);box-shadow:0 0 0 4px var(--brand-softer)}
.input svg{width:19px;height:19px;color:var(--muted);flex:none}
.input input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:15.5px;height:100%}
.input input::placeholder{color:var(--faint)}
.err{color:var(--red);font-size:13px;margin:8px 4px 0;min-height:1em}

.switch{width:50px;height:30px;border-radius:99px;background:var(--switch-off);position:relative;flex:none;transition:background .2s}
.switch::before{content:"";position:absolute;inset:-7px -4px}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.15);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--brand)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}

.gps{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.gps svg{width:14px;height:14px;flex:none}

/* ---------- Bottom nav ---------- */
.nav{position:absolute;left:0;right:0;bottom:0;z-index:30;height:var(--nav-h);padding:0 clamp(8px,4vw,22px) env(safe-area-inset-bottom);display:flex;align-items:center;justify-content:space-around;background:rgba(var(--surface-rgb),.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);border-radius:28px 28px 0 0;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.nav.hide{transform:translateY(110%);visibility:hidden}
.nav>button{width:56px;height:56px;display:grid;place-items:center;color:var(--faint);position:relative;border-radius:18px}
.nav>button svg{width:24px;height:24px}
.nav>button[aria-current="page"]{color:var(--ink)}
.nav>button[aria-current="page"]::after{content:"";position:absolute;bottom:6px;width:5px;height:5px;border-radius:50%;background:var(--brand)}
.nav .assist{width:68px;height:68px;margin-top:-34px;border-radius:50%;background:var(--surface);box-shadow:0 14px 30px -10px rgba(var(--brand-rgb),.35);padding:6px}
.assist .mini-orb{width:100%;height:100%;border-radius:50%;position:relative;overflow:hidden}
.mini-orb::before{content:"";position:absolute;inset:-30%;background:conic-gradient(from 0deg,#DF6D41,#F7D89A,#AAA648,#8DA6CC,#DF6D41);filter:blur(7px);animation:spin 8s linear infinite}
.mini-orb::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(38% 30% at 32% 28%,rgba(255,255,255,.95),rgba(var(--surface-rgb),0) 70%),radial-gradient(circle,rgba(var(--surface-rgb),0) 55%,rgba(255,255,255,.45) 75%)}
.nav .assist[aria-current="page"]::after{display:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Keep-style FAB ---------- */
.fab-wrap{position:absolute;right:var(--pad);bottom:calc(var(--nav-h) + 16px);z-index:35;display:flex;flex-direction:column;align-items:flex-end;gap:10px;pointer-events:none}
.fab-wrap.hide{display:none}
.fab{pointer-events:auto;width:60px;height:60px;border-radius:18px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand-deep);box-shadow:0 10px 22px -10px rgba(var(--shadow-rgb),.55),0 2px 6px rgba(var(--shadow-rgb),.15);transition:border-radius .3s,background .3s,transform .3s}
.fab svg{width:26px;height:26px;transition:transform .3s}
.fab-wrap.open .fab{color:var(--on-brand)!important;border-radius:50%;background:var(--brand-deep);color:#fff}
.fab-wrap.open .fab svg{transform:rotate(45deg)}
.fab-menu{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.fab-opt{pointer-events:auto;display:flex;align-items:center;gap:10px;height:52px;padding:0 20px 0 16px;border-radius:99px;background:var(--brand-soft);color:var(--brand-deep);font-weight:500;font-size:15.5px;box-shadow:0 8px 18px -12px rgba(var(--shadow-rgb),.5);opacity:0;transform:translateY(14px) scale(.9);transform-origin:right center;transition:opacity .22s,transform .28s cubic-bezier(.2,.9,.3,1.2);visibility:hidden}
.fab-opt svg{width:21px;height:21px}
.fab-wrap.open .fab-opt{opacity:1;transform:none;visibility:visible}
.fab-scrim{position:absolute;inset:0;z-index:34;background:rgba(var(--bg-rgb),.86);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .25s}
.fab-scrim.open{opacity:1;pointer-events:auto}

/* ---------- Sheets & modals ---------- */
.layer{position:absolute;inset:0;z-index:60;pointer-events:none}
.scrim{position:absolute;inset:0;background:rgba(var(--scrim-rgb),.45);opacity:0;transition:opacity .25s}
.layer.open{pointer-events:auto}
.layer.open .scrim{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;background:var(--surface);border-radius:30px 30px 0 0;padding:10px var(--pad) calc(24px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .34s cubic-bezier(.2,.8,.2,1);scrollbar-width:none}
.layer.open .sheet{transform:none}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 18px}
.sheet h3,.modal h3{font-size:19px;font-weight:600;letter-spacing:-.01em}
.modal{position:absolute;left:50%;top:50%;width:min(calc(100% - 48px),340px);max-height:86%;overflow:auto;background:var(--surface);border-radius:28px;transform:translate(-50%,-44%) scale(.94);opacity:0;transition:transform .32s cubic-bezier(.2,.9,.3,1.15),opacity .2s;box-shadow:0 30px 60px -30px rgba(var(--shadow-rgb),.5)}
.layer.open .modal{transform:translate(-50%,-50%);opacity:1}
.modal-body{padding:22px}
.menu-row{display:flex;align-items:center;gap:14px;width:100%;padding:14px 6px;border-radius:14px;font-size:15.5px}
.menu-row svg{width:21px;height:21px;color:var(--ink2)}
.menu-row:hover{background:var(--soft)}
.menu-row.danger,.menu-row.danger svg{color:var(--red)}

.toast{position:absolute;left:50%;bottom:calc(var(--nav-h) + 90px);z-index:90;transform:translate(-50%,10px);background:var(--ink);color:var(--bg);font-size:14px;padding:11px 16px;border-radius:14px;opacity:0;pointer-events:none;transition:.25s;max-width:calc(100% - 40px);text-align:center;box-shadow:0 12px 30px -12px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* ---------- Onboarding & auth ---------- */
.ob{display:flex;flex-direction:column;min-height:100%;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.ob-art{margin:calc(env(safe-area-inset-top) + 16px) var(--pad) 0;border-radius:var(--r-xl);overflow:hidden;aspect-ratio:1/1.02;max-height:48dvh;position:relative;box-shadow:var(--shadow)}
.ob-art svg{width:100%;height:100%}
.ob-skip{position:absolute;right:14px;top:14px;padding:8px 14px;border-radius:99px;background:rgba(var(--surface-rgb),.75);font-size:14px;font-weight:500}
.ob-text{padding:28px var(--pad) 0;flex:1}
.ob-text h1{font-family:var(--serif);font-size:clamp(28px,8.4vw,34px);line-height:1.15;font-weight:600}
.ob-text p{color:var(--muted);font-size:16px;line-height:1.55;margin-top:12px;max-width:34ch}
.ob-foot{display:flex;align-items:center;justify-content:space-between;padding:22px var(--pad) 0}
.dots{display:flex;gap:6px}.dots i{width:8px;height:8px;border-radius:99px;background:var(--line);transition:width .3s,background .3s}.dots i.on{width:26px;background:var(--brand)}

.auth{padding:calc(env(safe-area-inset-top) + 16px) var(--pad) calc(28px + env(safe-area-inset-bottom))}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:18px;letter-spacing:.01em}
.brand .mini-orb{width:34px;height:34px}
.auth h1{font-family:var(--serif);font-size:clamp(30px,9vw,38px);line-height:1.12;font-weight:600;margin-top:28px}
.auth .sub{color:var(--muted);margin-top:8px;font-size:15.5px;line-height:1.5}
.social{display:grid;gap:10px;margin-top:26px}
.sbtn{display:flex;align-items:center;justify-content:center;gap:12px;height:54px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-weight:500;font-size:15.5px;transition:background .2s}
.sbtn:hover{background:var(--soft)}
.sbtn svg{width:20px;height:20px}
.sbtn.apple{background:#000;color:#fff;border-color:#000}
html[data-theme="dark"] .sbtn.apple{background:#fff;color:#000;border-color:#fff}
.social-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.social-row .sbtn{gap:8px;font-size:14.5px}
.or{display:flex;align-items:center;gap:12px;color:var(--faint);font-size:13px;margin:22px 0 6px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.auth-switch{text-align:center;margin-top:22px;color:var(--muted);font-size:15px}
.auth-switch button{color:var(--brand-deep);font-weight:600}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--muted);margin-top:16px;line-height:1.45}
.check input{width:20px;height:20px;accent-color:var(--brand);flex:none;margin-top:1px}

/* ---------- Home ---------- */
.date-strip .day{width:66px;padding:12px 0;border-radius:18px;text-align:center;background:transparent;border:1px solid var(--line);color:var(--muted)}
.day small{display:block;font-size:12px}
.day b{display:block;font-size:20px;font-weight:600;color:var(--ink);margin:2px 0}
.day[aria-pressed="true"]{background:var(--surface);border-color:var(--line);box-shadow:var(--shadow);color:var(--ink2)}
.capture{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px var(--pad) 0}
.cap{position:relative;border-radius:var(--r-lg);padding:16px;overflow:hidden;text-align:left;min-height:120px;display:flex;flex-direction:column;justify-content:flex-end}
.cap .ico{position:absolute;top:14px;left:14px;width:44px;height:44px;border-radius:50%;background:rgba(var(--surface-rgb),.7);display:grid;place-items:center}
.cap .ico svg{width:21px;height:21px}
.cap b{font-size:16px;font-weight:500;line-height:1.25;display:flex;align-items:center;justify-content:space-between;gap:6px}
.cap b svg{width:20px;height:20px}
.cap small{font-size:13px;opacity:.7;margin-top:4px}
.cap.big{grid-row:span 2;background:linear-gradient(160deg,var(--cap-a),var(--cap-b));min-height:256px}
.cap.big::before{content:"";position:absolute;left:-40px;top:-40px;width:200px;height:200px;border-radius:50%;background:repeating-conic-gradient(rgba(255,255,255,.35) 0 10deg,transparent 10deg 22deg)}
.cap.big .go{margin-top:14px;height:46px;border-radius:99px;background:var(--canyon);color:var(--ink);font-weight:600;display:grid;place-items:center;font-size:15px;box-shadow:0 10px 20px -10px rgba(var(--brand-rgb),.5);position:relative}

.badge{position:absolute;top:10px;right:10px;background:var(--canyon-deep);color:#fff;font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px}
.folder{width:clamp(148px,44vw,170px);border-radius:var(--r-lg);padding:16px;text-align:left;min-height:132px;display:flex;flex-direction:column}

.ring-card b{display:block;margin-top:12px;font-size:14px;font-weight:600;line-height:1.25}

.masonry{columns:2;column-gap:12px;padding:14px var(--pad) 0}

.scene-card{position:relative;border-radius:var(--r-lg);overflow:hidden;color:#fff;display:block;text-align:left;box-shadow:var(--shadow-sm)}

.scene-card .sc-in{z-index:1;position:absolute;left:14px;right:14px;top:14px}

.pill-w{display:inline-flex;align-items:center;gap:5px;margin-top:8px;padding:4px 9px;border-radius:99px;background:rgba(var(--surface-rgb),.92);color:var(--ink2);font-size:11.5px;font-weight:500}
.pill-w svg{width:12px;height:12px}
.meet-mini{display:flex;align-items:center;gap:12px;margin:14px var(--pad) 0;padding:14px;border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow-sm);width:calc(100% - 2*var(--pad));text-align:left}

/* ---------- Keep notes ---------- */
.kbar{display:flex;align-items:center;gap:6px;height:56px;margin:calc(env(safe-area-inset-top) + 14px) var(--pad) 0;padding:0 6px 0 8px;border-radius:30px;background:var(--soft)}

.kbar input::placeholder{color:var(--muted)}
.klabel{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em;padding:20px var(--pad) 0}
.knote{position:relative;display:block;text-align:left;border-radius:16px;padding:14px 14px 12px;background:var(--c,#fff);border:1px solid rgba(var(--ink-rgb),.07);transition:transform .15s}
.knote[data-c="default"]{border-color:var(--line)}
.knote:active{transform:scale(.98)}
.knote .kt{font-size:16px;font-weight:500;line-height:1.3;margin-bottom:6px;overflow-wrap:anywhere}
.knote .kb{font-size:14px;line-height:1.5;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:9;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line;overflow-wrap:anywhere}
.knote .kl{list-style:none;display:grid;gap:5px;font-size:14px;color:var(--ink2)}

.knote .kl li.done i{background:var(--muted)}
.kmeta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:10px;font-size:11.5px;color:var(--muted)}
.klabels{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.klabels span{font-size:11.5px;padding:3px 8px;border-radius:7px;background:rgba(var(--ink-rgb),.07);color:var(--ink2)}
.kai{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--brand-deep);background:rgba(var(--surface-rgb),.7);padding:3px 8px;border-radius:99px;margin-bottom:8px}
.kai svg{width:12px;height:12px}
.kpin{position:absolute;top:10px;right:10px;color:var(--ink2);opacity:.6}
.kpin svg{width:16px;height:16px}
.list-view{columns:1!important}
.empty{text-align:center;padding:60px 30px;color:var(--muted)}
.empty svg{width:120px;height:120px;margin:0 auto 14px;color:var(--faint)}
.empty b{display:block;color:var(--ink);font-size:17px;font-weight:600;margin-bottom:6px}

/* Editor */
.editor{min-height:100%;display:flex;flex-direction:column;background:var(--ec,#fff);transition:background .3s}
.ed-top{display:flex;align-items:center;gap:4px;padding:calc(env(safe-area-inset-top) + 12px) 12px 0}
.ed-top .grow{flex:1}
.ed-body{flex:1;padding:10px 22px 28px}
.ed-title{width:100%;border:0;outline:0;background:transparent;font-size:24px;font-weight:500;letter-spacing:-.01em;padding:6px 0}
.ed-title::placeholder,.ed-text::placeholder{color:rgba(var(--ink-rgb),.38)}
.ed-text{width:100%;border:0;outline:0;background:transparent;resize:none;font-size:17px;line-height:1.6;min-height:220px;font-family:inherit}
.ed-meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink2);opacity:.75;margin:6px 0 10px}

.ed-meta svg{width:14px;height:14px}
.ed-list{list-style:none;display:grid;grid-template-columns:minmax(0,1fr);gap:2px;margin-top:6px}
.ed-list li{display:flex;align-items:center;gap:10px;min-height:44px}
.ed-list li.done input[type=text]{text-decoration:line-through;opacity:.5}
.ed-list input[type=checkbox]{width:20px;height:20px;accent-color:var(--ink2);flex:none}
.ed-list input[type=text]{flex:1 1 0;min-width:0;width:0;border:0;outline:0;background:transparent;font-size:17px}
.ed-list .del{opacity:.5}
.ed-list .del svg{width:18px;height:18px}
.ed-add{display:flex;align-items:center;gap:10px;min-height:44px;color:var(--ink2);opacity:.7;font-size:16px}
.ed-add svg{width:20px;height:20px}
.ed-bar{position:sticky;bottom:0;z-index:20;display:flex;align-items:center;gap:2px;padding:8px 10px calc(10px + env(safe-area-inset-bottom));background:var(--ec,#fff);border-top:1px solid rgba(0,0,0,.06)}
.ed-bar .grow{flex:1;text-align:center;font-size:12.5px;color:var(--ink2);opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.palette{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 10px;scrollbar-width:none}
.swatch{width:46px;height:46px;border-radius:50%;flex:none;border:2px solid rgba(var(--ink-rgb),.1);display:grid;place-items:center}
.swatch[aria-pressed="true"]{border-color:var(--brand-deep);box-shadow:0 0 0 3px var(--surface) inset}
.swatch svg{width:18px;height:18px}

/* ---------- AI note view (image 1 detail) ---------- */
.nv-hero{position:relative;height:clamp(250px,40dvh,340px);border-radius:0 0 38px 38px;overflow:hidden}
.nv-hero svg.scene{position:absolute;inset:0;width:100%;height:100%}
.nv-hero .top{position:absolute;left:0;right:0;top:0}
.nv-card{position:relative;margin:-54px var(--pad) 0;background:var(--surface);border-radius:28px;padding:22px 20px 18px;box-shadow:var(--shadow)}

.nv-fav svg{width:22px;height:22px}
.nv-mode{font-size:12.5px;font-weight:600;color:var(--brand-deep)}
.nv-title{font-size:clamp(23px,6.6vw,27px);font-weight:600;letter-spacing:-.02em;line-height:1.2;margin-top:4px;padding-right:40px}
.nv-meta{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:12px;font-size:13.5px;color:var(--muted)}
.nv-meta span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.nv-meta svg{width:15px;height:15px;color:var(--brand)}
.nv-body{padding:8px var(--pad) 32px;font-family:var(--read);font-size:clamp(17px,4.6vw,18.5px);line-height:1.62;color:var(--ink2)}

.nv-body .verse{margin:1.2em 0;padding:16px 18px;border-radius:18px;background:linear-gradient(135deg,var(--verse-a),var(--verse-b));border-left:3px solid var(--brand);font-style:italic;color:var(--ink)}
.nv-body .verse cite{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-top:10px;font:500 13px "Outfit",sans-serif;color:var(--brand-deep)}

.nv-body .illus{font:14px/1.5 "Outfit",sans-serif;color:var(--muted);border-left:3px solid var(--faint);padding:8px 12px;margin:0 0 1em}

.nv-body .transcript{font:15px/1.65 "Outfit",sans-serif;color:var(--ink2);white-space:pre-line}
.nv-body [contenteditable="true"]{outline:2px dashed var(--brand-line);outline-offset:6px;border-radius:6px}
.mark{display:inline-flex;align-items:center;gap:4px;font:500 12px "Outfit";color:var(--canyon-deep);background:var(--canyon-soft);padding:2px 8px;border-radius:99px;margin:0 2px}
.seg{display:flex;gap:4px;padding:4px;background:var(--soft);border-radius:14px;margin:4px 0 14px;font-family:"Outfit",sans-serif}

.seg button[aria-selected="true"]{background:var(--surface);color:var(--brand-deep);font-weight:500;box-shadow:0 2px 8px -4px rgba(0,0,0,.15)}
.sum-card{font-family:"Outfit",sans-serif;font-size:15.5px;line-height:1.6;color:var(--ink2)}
.sum-card ul li::before{top:.62em}
.shimmer{height:13px;border-radius:7px;margin:12px 0;background:linear-gradient(90deg,var(--soft),var(--surface),var(--soft));background-size:200% 100%;animation:sh 1.1s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.actionbar{position:sticky;bottom:0;z-index:20;display:flex;align-items:center;gap:12px;padding:14px var(--pad) calc(16px + env(safe-area-inset-bottom));background:var(--surface);border-radius:28px 28px 0 0;box-shadow:0 -12px 30px -24px rgba(var(--shadow-rgb),.35)}
.actionbar .lbl{font-size:12.5px;color:var(--muted)}

.actionbar .grow{flex:1;min-width:0}
.player{display:flex;align-items:center;gap:10px;margin:14px var(--pad) 0;padding:10px 14px 10px 10px;background:var(--surface);border-radius:99px;box-shadow:var(--shadow-sm)}
.player .pbtn{width:40px;height:40px;border-radius:50%;background:var(--brand);color:var(--on-brand);background:var(--brand-deep)!important;display:grid;place-items:center;flex:none}
.player .pbtn svg{width:17px;height:17px}
.player input[type=range]{flex:1;accent-color:var(--brand)}
.player small{font-size:12.5px;color:var(--muted);min-width:70px;text-align:right}
video.nv-video{display:block;width:calc(100% - 2*var(--pad));margin:14px auto 0;border-radius:20px;background:#000;max-height:40dvh}

/* ---------- Full-screen purple (assistant, recorder, call) ---------- */
.violet{background:radial-gradient(120% 60% at 50% 32%,var(--voice-a) 0%,transparent 70%),linear-gradient(180deg,var(--voice-a) 0%,var(--voice-b) 52%,var(--voice-c) 100%)}
.fs{position:absolute;inset:0;z-index:50;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto auto;overflow:hidden;animation:rise .38s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(30px)}}
.fs-head{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 14px) var(--pad) 0}
.fs-title{text-align:center;font-size:clamp(16px,4.6vw,19px);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fs-sub{text-align:center;color:var(--muted);font-size:14px;margin-top:clamp(8px,2.4dvh,22px);padding:0 var(--pad);min-height:20px}
.visual{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,2.2dvh,22px);padding:6px var(--pad);min-height:0}
.orb-wrap{--orb:clamp(110px,min(50vw,25dvh),220px);position:relative;width:calc(var(--orb)*1.25);aspect-ratio:1;display:grid;place-items:center;max-width:100%}
.halo{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(var(--surface-rgb),.42) 60%,rgba(var(--surface-rgb),0) 71%);transition:transform .6s}
.orb{position:relative;width:var(--orb);aspect-ratio:1;border-radius:50%;overflow:hidden;box-shadow:0 calc(var(--orb)*.15) calc(var(--orb)*.25) calc(var(--orb)*-.1) rgba(223,109,65,.35),inset 0 calc(var(--orb)*-.09) calc(var(--orb)*.15) rgba(var(--surface-rgb),.55),inset 0 calc(var(--orb)*.05) calc(var(--orb)*.13) rgba(var(--shadow-rgb),.35);animation:breathe 5s ease-in-out infinite;transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
.orb::before{content:"";position:absolute;inset:-30%;background:conic-gradient(from 0deg,#DF6D41,#F7D89A,#AAA648,#8DA6CC,#DF6D41);filter:blur(calc(var(--orb)*.09));animation:spin 14s linear infinite}
.orb::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(38% 28% at 32% 26%,rgba(255,255,255,.95),rgba(var(--surface-rgb),0) 70%),radial-gradient(60% 30% at 50% 88%,rgba(var(--surface-rgb),.7),rgba(var(--surface-rgb),0) 70%),radial-gradient(circle,rgba(var(--surface-rgb),0) 55%,rgba(255,255,255,.45) 72%)}
.st-listening .orb,.st-rec .orb{transform:scale(1.07)}
.st-listening .orb::before,.st-rec .orb::before{animation-duration:4s}
.st-thinking .orb::before{animation-duration:1.6s}
.st-speaking .orb{animation:talk 1.1s ease-in-out infinite}
.st-listening .halo,.st-speaking .halo,.st-rec .halo{transform:scale(1.1)}
@keyframes breathe{50%{transform:scale(1.025)}}
@keyframes talk{50%{transform:scale(1.05)}}
.wave{width:100%;max-width:520px;height:clamp(36px,7dvh,72px);display:flex;align-items:center;justify-content:space-between}
.wave i{display:block;width:3px;flex:none;border-radius:3px;background:linear-gradient(180deg,var(--brand-deep),var(--brand));height:6px}
.speech{padding:clamp(4px,1.4dvh,14px) var(--pad) 12px;font-size:clamp(16px,calc(.9rem + .9dvh),21px);line-height:1.5;max-height:clamp(96px,24dvh,220px);min-height:calc(1.5em*3);overflow-y:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(180deg,#000 78%,transparent);mask-image:linear-gradient(180deg,#000 78%,transparent);width:100%;max-width:640px;justify-self:center}
.speech::-webkit-scrollbar{display:none}
.speech .w{transition:color .35s}.speech .ink{color:var(--ink)}.speech .near{color:var(--muted)}.speech .far{color:var(--faint)}
.speech .you{font-size:13px;color:var(--muted);margin-bottom:6px;min-height:1.2em}
.type-row{display:none;gap:8px;align-items:center;margin-top:6px}
.type-row.on{display:flex}
.type-row input{flex:1;min-width:0;height:48px;border-radius:99px;border:1px solid var(--line);background:rgba(var(--surface-rgb),.85);padding:0 18px;outline:0;font-size:16px}
.fs-controls{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:640px;justify-self:center;padding:clamp(8px,1.8dvh,16px) var(--pad) calc(clamp(14px,3dvh,26px) + env(safe-area-inset-bottom))}
.mic-ring{--ring:clamp(84px,min(28vw,13dvh),120px);width:var(--ring);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:rgba(var(--surface-rgb),.55);border:1px solid rgba(var(--surface-rgb),.85);position:relative}
.mic-ring::before{content:"";position:absolute;inset:-1px;border-radius:50%;border:2px solid var(--brand);opacity:0}
.st-listening .mic-ring::before,.st-rec .mic-ring::before{animation:ping 1.4s ease-out infinite}
@keyframes ping{0%{opacity:.5;transform:scale(1)}100%{opacity:0;transform:scale(1.35)}}
.mic{width:56%;aspect-ratio:1;min-width:48px;border-radius:50%;background:linear-gradient(145deg,var(--grad-a),var(--grad-b));display:grid;place-items:center;color:var(--on-brand);box-shadow:0 10px 24px -8px rgba(var(--brand-rgb),.55),inset 0 2px 6px rgba(255,255,255,.35)}
.mic svg{width:38%;height:38%}
.mic.rec{background:linear-gradient(145deg,#D9584A,#B03226);box-shadow:0 10px 24px -8px rgba(176,50,38,.6)}
.ibtn.glass-lg{width:52px;height:52px;background:rgba(var(--surface-rgb),.6);border:1px solid rgba(var(--surface-rgb),.85);box-shadow:none}
.ibtn.glass-lg svg{width:22px;height:22px}
.ibtn.glass-lg:disabled{opacity:.4}
.timer{font-size:clamp(34px,10vw,46px);font-weight:300;letter-spacing:.02em;font-variant-numeric:tabular-nums;text-align:center}
.rec-info{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;color:var(--ink2)}
.rec-video{width:min(100%,calc(var(--orb,200px)*1.5));aspect-ratio:3/4;max-height:34dvh;border-radius:26px;overflow:hidden;background:#1C1F25;position:relative;box-shadow:var(--shadow)}
.rec-video video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.rec-video .novid{position:absolute;inset:0;display:grid;place-items:center;color:#D9CFC2;font-size:14px;text-align:center;padding:20px}
.recdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--red);margin-right:6px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.mode-row{display:flex;gap:6px;justify-content:safe center;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:12px var(--pad) 2px}
.mode-row::-webkit-scrollbar{display:none}
.mode-row .chip{flex:none;padding:8px 12px;font-size:13.5px;min-height:36px}
.mode-row .chip{background:rgba(var(--surface-rgb),.6)}
.mode-row .chip[aria-pressed="true"]{background:var(--surface);color:var(--brand-deep)}
.av-toggle{display:flex;gap:4px;padding:4px;border-radius:99px;background:rgba(var(--surface-rgb),.55);margin:12px auto 0;width:max-content}
.av-toggle button{padding:8px 18px;border-radius:99px;font-size:14px;font-weight:500;color:var(--muted)}
.av-toggle button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 8px -4px rgba(0,0,0,.2)}

/* Processing modal (image 1 dialog) */
.proc-art{height:170px;position:relative;overflow:hidden;border-radius:28px 28px 0 0}
.proc-art svg{width:100%;height:100%}
.steps{list-style:none;display:grid;gap:10px;margin:16px 0 20px;text-align:left}
.steps li{display:flex;align-items:center;gap:10px;font-size:14.5px;color:var(--faint);transition:color .3s}
.steps li i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;transition:.3s}
.steps li i svg{width:13px;height:13px;opacity:0}
.steps li.doing{color:var(--ink)}
.steps li.doing i{border-color:var(--brand);border-top-color:transparent;animation:spin .8s linear infinite}
.steps li.done{color:var(--ink2)}
.steps li.done i{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.steps li.done i svg{opacity:1}

/* ---------- Meetings (image 3) ---------- */
.mhead{background:linear-gradient(150deg,var(--grad-a),var(--grad-b));color:var(--on-brand);border-radius:0 0 34px 34px;padding:calc(env(safe-area-inset-top) + 16px) var(--pad) 26px}
.mhead small{opacity:.8;font-size:14px}
.mhead h1{font-size:clamp(30px,8.6vw,36px);font-weight:600;letter-spacing:-.02em;margin-top:4px}
.msearch{display:flex;align-items:center;gap:10px;height:50px;border-radius:99px;background:var(--surface);color:var(--muted);padding:0 18px;margin-top:18px}
.msearch svg{width:18px;height:18px}
.msearch input{border:0;outline:0;flex:1;min-width:0;font-size:15px;color:var(--ink);background:transparent}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:18px var(--pad) 0}
.mcard{border-radius:var(--r-lg);padding:14px;text-align:left;min-height:170px;display:flex;flex-direction:column}
.mcard .sq{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff}
.mcard .sq svg{width:20px;height:20px}
.mcard small{font-size:12px;color:var(--muted);margin-top:12px}
.mcard b{font-size:15px;font-weight:600;color:var(--ink);line-height:1.25;margin-top:2px}
.mcard .mfoot{display:flex;justify-content:space-between;margin-top:auto;padding-top:12px;font-size:12px;color:var(--ink2);font-weight:500}
.tl{margin:16px var(--pad) 0;background:var(--surface);border-radius:28px;padding:6px 18px;box-shadow:var(--shadow-sm)}
.tl-item{display:block;width:100%;padding:16px 0;border-bottom:1px solid var(--line);text-align:left}
.tl-item:last-child{border-bottom:0}
.tl-date{text-align:center;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:10px}
.tl-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tl-row .lbl{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.tl-row .lbl i{width:8px;height:8px;border-radius:2px}
.tl-row b{font-size:16px;font-weight:600;display:block;margin-top:2px}
.tl-times{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:12.5px;color:var(--faint)}
.tl-times::before{content:"";order:2;flex:1;height:1px;background:var(--line)}
.tl-times span:nth-child(2){order:3;color:var(--ink2);font-weight:500}
.tl-times span:nth-child(3){order:4}
.tl-times span:nth-child(2)::after{content:"";display:inline-block;width:40px;height:1px;background:var(--line);vertical-align:middle;margin-left:10px}
.apps{display:flex;gap:8px;flex-wrap:wrap;padding:14px var(--pad) 0}
.logo-sq{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700;flex:none}

/* call */
.call{position:absolute;inset:0;z-index:55;background:linear-gradient(180deg,#1C1F25,#262B33);color:#fff;display:flex;flex-direction:column;animation:rise .35s ease}
.call-head{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 16px) var(--pad) 0}
.call-head small{opacity:.7;font-size:13px}
.tiles{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px var(--pad);min-height:0}
.tile{border-radius:22px;background:rgba(255,255,255,.07);display:grid;place-items:center;position:relative;overflow:hidden;min-height:0}
.tile .avatar{width:64px;height:64px;font-size:20px;box-shadow:none}
.tile.speaking{box-shadow:inset 0 0 0 3px #F7D89A}
.tile span.nm{position:absolute;left:10px;bottom:10px;font-size:12.5px;background:rgba(0,0,0,.35);padding:3px 9px;border-radius:99px}
.tile video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.captions{margin:0 var(--pad);padding:12px 14px;border-radius:18px;background:rgba(0,0,0,.35);font-size:14.5px;line-height:1.45;min-height:66px}
.captions b{color:#F7D89A;font-weight:500}
.call-ctrl{display:flex;justify-content:center;gap:14px;padding:16px var(--pad) calc(22px + env(safe-area-inset-bottom))}
.call-ctrl button{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center}
.call-ctrl button svg{width:22px;height:22px}
.call-ctrl button[aria-pressed="false"]{background:#fff;color:#1F2430;color:var(--ink)}
.call-ctrl .end{background:var(--red);width:72px;border-radius:99px}

/* ---------- Community (image 4 feed) ---------- */
.post{margin:14px var(--pad) 0;background:var(--surface);border-radius:24px;padding:14px;box-shadow:var(--shadow-sm)}
.post-head{display:flex;align-items:center;gap:10px}
.post-head b{font-size:14.5px;font-weight:600}
.post-head small{display:block;font-size:12px;color:var(--muted)}
.post-head .grow{flex:1;min-width:0}
.post p{font-size:14.5px;line-height:1.5;color:var(--ink2);margin:10px 2px}
.post-grid{display:grid;grid-template-columns:1.5fr 1fr;grid-template-rows:1fr 1fr;gap:8px;height:190px}
.post-grid>*{border-radius:14px;overflow:hidden;position:relative}
.post-grid>*:first-child{grid-row:span 2}
.post-grid svg{width:100%;height:100%}
.post-grid .ov{position:absolute;left:10px;right:10px;bottom:10px;color:#fff;font-weight:600;font-size:14px;line-height:1.25}
.post-actions{display:flex;align-items:center;gap:6px;margin-top:10px;color:var(--muted);font-size:13px}
.post-actions button{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:40px;min-width:40px;padding:0 10px;border-radius:12px}
.post-actions svg{width:19px;height:19px}
.post-actions .like{width:40px;height:40px;border-radius:50%;background:var(--canyon);color:#fff;justify-content:center;padding:0}
.post-actions .like[aria-pressed="false"]{background:var(--soft);color:var(--pink)}
.post-actions .grow{flex:1}
.composer{position:absolute;left:var(--pad);right:var(--pad);bottom:calc(var(--nav-h) + 12px);z-index:25;display:flex;align-items:center;gap:10px;height:54px;padding:0 8px 0 18px;border-radius:18px;background:var(--surface);box-shadow:0 12px 30px -16px rgba(var(--shadow-rgb),.45);color:var(--muted);font-size:14.5px;width:calc(100% - 2*var(--pad))}
.composer .grow{flex:1;text-align:left}
.stack{display:flex}.stack .avatar{margin-left:-8px}
.group{display:flex;align-items:center;gap:12px;margin:12px var(--pad) 0;padding:12px;border-radius:22px;background:var(--surface);box-shadow:var(--shadow-sm)}
.group .gart{width:64px;height:64px;border-radius:16px;overflow:hidden;flex:none}
.group .gart svg{width:100%;height:100%}
.group .grow{flex:1;min-width:0}
.group b{font-size:15.5px;font-weight:600;display:block}
.group small{font-size:12.5px;color:var(--muted)}
.live{margin:12px var(--pad) 0;border-radius:24px;padding:16px;position:relative;overflow:hidden}
.live .tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--surface)}
.live b{display:block;font-size:18px;font-weight:600;margin-top:12px;line-height:1.25}
.live small{display:block;font-size:13px;color:var(--ink2);margin-top:4px}
.live .lfoot{display:flex;align-items:center;justify-content:space-between;margin-top:14px;gap:10px}

/* ---------- Reminders (image 5) ---------- */
.rem-top{text-align:center;padding:calc(env(safe-area-inset-top) + 20px) var(--pad) 0;position:relative;overflow-x:clip}
.rem-top .bubble{position:absolute;border-radius:50%}
.rem-top .emblem{width:78px;height:78px;margin:18px auto 0;border-radius:24px;background:linear-gradient(145deg,var(--surface),var(--brand-soft));display:grid;place-items:center;box-shadow:var(--shadow);transform:rotate(-8deg)}
.rem-top .emblem svg{width:40px;height:40px;color:var(--brand)}
.rem-top h1{font-size:clamp(28px,8vw,34px);font-weight:300;margin-top:18px;letter-spacing:-.01em}
.tabs-plus{display:flex;align-items:center;gap:22px;padding:0 var(--pad);margin-top:18px}
.plus-sq{margin-left:auto;width:44px;height:44px;border-radius:14px;background:var(--brand-deep);color:var(--on-brand);display:grid;place-items:center;box-shadow:0 12px 22px -10px rgba(var(--brand-rgb),.5)}
.plus-sq svg{width:22px;height:22px}
.rem-row{display:flex;align-items:center;gap:12px;margin:10px var(--pad) 0;padding:14px;border-radius:20px;background:var(--surface);box-shadow:var(--shadow-sm);width:calc(100% - 2*var(--pad));text-align:left}
.rem-row .rtime{font-size:12.5px;color:var(--muted);margin-top:2px}
.rem-row .grow{flex:1;min-width:0}
.rem-row b{font-size:15px;font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rem-row.done b{text-decoration:line-through;color:var(--muted)}
.rcheck{width:26px;height:26px;border-radius:9px;border:2px solid var(--faint);display:grid;place-items:center;flex:none;color:#fff;position:relative}
.rcheck::before{content:"";position:absolute;inset:-10px}
.rcheck svg{width:15px;height:15px;opacity:0}
.rem-row.done .rcheck{background:var(--brand-deep);border-color:var(--brand-deep);color:var(--on-brand)}
.rem-row.done .rcheck svg{opacity:1}

/* ---------- Profile (image 3 right) ---------- */
.phead{background:linear-gradient(150deg,var(--grad-a),var(--grad-b));color:var(--on-brand);border-radius:0 0 34px 34px;padding:calc(env(safe-area-inset-top) + 14px) var(--pad) 70px}
.pid{display:flex;gap:16px;align-items:center;margin-top:18px}
.photo{width:92px;height:104px;border-radius:18px;background:var(--soft);display:grid;place-items:center;font-size:30px;font-weight:600;color:var(--ink);overflow:hidden;position:relative;flex:none;box-shadow:0 12px 24px -12px rgba(0,0,0,.4)}
.pid b{font-size:21px;font-weight:600;display:block}
.pid small{opacity:.85;font-size:14px}
.pid .btn{height:40px;margin-top:12px;background:var(--butter);color:var(--ink);font-size:14px;padding:0 18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin:-46px var(--pad) 0;background:var(--surface);border-radius:24px;padding:16px 6px;box-shadow:var(--shadow);position:relative}
.stats div{text-align:center}
.stats b{display:block;font-size:22px;font-weight:600}
.stats small{font-size:12px;color:var(--muted)}
.plist{margin:12px var(--pad) 0;background:var(--surface);border-radius:24px;padding:4px 16px;box-shadow:var(--shadow-sm)}
.plist h4{font-size:13px;font-weight:600;color:var(--muted);padding:16px 0 4px}
.prow{display:flex;align-items:center;gap:14px;width:100%;min-height:56px;padding:8px 0;border-bottom:1px solid var(--line);text-align:left;font-size:15.5px}
.prow:last-child{border-bottom:0}
.prow .pic{width:36px;height:36px;border-radius:11px;background:var(--brand-softer);color:var(--brand-deep);display:grid;place-items:center;flex:none}
.prow .pic svg{width:19px;height:19px}
.prow .grow{flex:1;min-width:0}
.prow small{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.prow .val{font-size:14px;color:var(--muted)}
.prow .chev{width:18px;height:18px;color:var(--faint)}
.upgrade{display:flex;gap:14px;align-items:center;margin:12px var(--pad) 0;padding:16px;border-radius:24px;background:linear-gradient(135deg,var(--up-a),var(--up-b));text-align:left;width:calc(100% - 2*var(--pad))}
.upgrade svg.ill{width:72px;height:72px;flex:none}
.upgrade b{font-size:16px;font-weight:600;display:block}
.upgrade small{font-size:13px;color:var(--ink2);display:block;margin-top:2px;line-height:1.4}

/* ---------- Menu overlay (image 4) ---------- */
.gmenu{position:absolute;left:0;right:0;top:0;background:var(--surface);border-radius:0 0 30px 30px;padding:calc(env(safe-area-inset-top) + 16px) var(--pad) 26px;transform:translateY(-105%);transition:transform .38s cubic-bezier(.2,.8,.2,1);box-shadow:0 30px 60px -30px rgba(var(--shadow-rgb),.35)}
.layer.open .gmenu{transform:none}
.gmenu-head{display:flex;justify-content:space-between;align-items:center}
.ggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 6px;margin-top:14px}
.gitem{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 4px;border-radius:18px;font-size:13px;color:var(--muted)}
.gitem i{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:var(--ink2);transition:.2s}
.gitem i svg{width:24px;height:24px}
.gitem:hover i,.gitem.hl i{background:var(--brand-deep);color:var(--on-brand);box-shadow:0 12px 24px -10px rgba(var(--brand-rgb),.45)}
.gitem.hl{color:var(--ink)}


/* ---------- Folders (image 2) ---------- */
.big-caps{font-size:clamp(30px,9vw,38px);font-weight:700;letter-spacing:-.01em;text-transform:uppercase;padding:14px var(--pad) 0}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px var(--pad) 0}
.fgrid .folder{width:auto;position:relative}
.ncards .ncard{width:clamp(200px,62vw,240px);border-radius:var(--r-lg);padding:16px;text-align:left;display:flex;flex-direction:column;min-height:220px}
.ncard small{font-size:11.5px;color:var(--ink2);opacity:.75}
.ncard .nh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-bottom:10px;border-bottom:1px solid rgba(0,0,0,.12);margin-top:4px}
.ncard .nh b{font-size:17px;font-weight:500}
.ncard .nh i{width:22px;height:22px;border-radius:6px;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex:none}
.ncard .nh i svg{width:13px;height:13px}
.ncard p{font-size:13.5px;line-height:1.55;color:var(--ink2);margin-top:10px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.ncard .nf{margin-top:auto;padding-top:12px;font-size:11.5px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.ncard .nf svg{width:14px;height:14px}

/* ---------- Studio / rehearse / upgrade ---------- */
.fmt{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px var(--pad) 0}
.fmt button{padding:14px;border-radius:18px;background:var(--surface);border:1.5px solid var(--line);text-align:left;min-height:92px;display:flex;flex-direction:column;gap:8px}
.fmt button svg{width:22px;height:22px;color:var(--brand)}
.fmt button b{font-size:14.5px;font-weight:500}
.fmt button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-softer)}
.pick{width:150px;border-radius:18px;overflow:hidden;background:var(--surface);border:2px solid transparent;text-align:left;box-shadow:var(--shadow-sm)}
.pick[aria-pressed="true"]{border-color:var(--brand)}
.pick .pa{height:78px}
.pick .pa svg{width:100%;height:100%}
.pick b{display:block;font-size:13.5px;font-weight:500;padding:8px 10px 10px;line-height:1.25}
.out{margin:16px var(--pad) 0;background:var(--surface);border-radius:24px;padding:18px;box-shadow:var(--shadow-sm);white-space:pre-line;font-size:15px;line-height:1.6;color:var(--ink2);outline:0}
.prompter{position:absolute;inset:0;z-index:55;background:#17191D;color:#fff;display:flex;flex-direction:column;animation:fade .3s}
.prompter-text{flex:1;overflow:hidden;position:relative;-webkit-mask-image:linear-gradient(180deg,transparent,#000 18%,#000 70%,transparent);mask-image:linear-gradient(180deg,transparent,#000 18%,#000 70%,transparent)}
.prompter-text .scroll{position:absolute;left:0;right:0;padding:40dvh var(--pad) 60dvh;font-size:clamp(26px,7.4vw,34px);line-height:1.45;font-weight:500}
.prompter-text .scroll h4{color:#F7D89A;font-size:.8em;margin-top:1em}
.prompter.mirror .scroll{transform:scaleX(-1)}
.prompter-ctrl{display:flex;align-items:center;gap:12px;padding:14px var(--pad) calc(20px + env(safe-area-inset-bottom));background:#23262C}
.prompter-ctrl input{flex:1;accent-color:#8DA6CC}
.prompter .ibtn{background:rgba(255,255,255,.1);box-shadow:none;color:#fff}
.plan{margin:12px var(--pad) 0;padding:18px;border-radius:24px;border:2px solid var(--line);background:var(--surface);text-align:left;width:calc(100% - 2*var(--pad));display:block}
.plan[aria-pressed="true"]{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-softer)}
.plan .ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.plan b{font-size:18px;font-weight:600}
.plan .price{font-size:22px;font-weight:600}
.plan .price small{font-size:13px;color:var(--muted);font-weight:400}
.plan ul{list-style:none;margin-top:10px;display:grid;gap:6px;font-size:14px;color:var(--ink2)}
.plan li{display:flex;gap:8px;align-items:flex-start}
.plan li svg{width:16px;height:16px;color:var(--green);flex:none;margin-top:2px}
.notif{display:flex;gap:12px;margin:0 var(--pad);padding:14px 0;border-bottom:1px solid var(--line);text-align:left;width:calc(100% - 2*var(--pad))}
.notif i{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.notif i svg{width:20px;height:20px}
.notif b{font-size:15px;font-weight:500;display:block}
.notif small{font-size:13px;color:var(--muted);line-height:1.4;display:block;margin-top:2px}
.notif.unread b::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--pink);margin-left:6px;vertical-align:middle}

@media (orientation:landscape) and (max-height:560px){
  .ob-art{max-height:60dvh;aspect-ratio:auto;height:60dvh}
  .masonry{columns:3}
  .fgrid,.mgrid{grid-template-columns:repeat(4,1fr)}
  .capture{grid-template-columns:repeat(3,1fr)}.cap.big{grid-row:auto;min-height:150px}
}
@media (min-width:700px) and (max-height:759px){.masonry{columns:3}}

/* ---------- WebGL gradient orb ---------- */
.orb.gl,.mini-orb.gl{overflow:visible;box-shadow:none;background:none;animation:none}
.orb.gl::before,.orb.gl::after,.mini-orb.gl::before,.mini-orb.gl::after{display:none}
.orb.gl canvas,.mini-orb.gl canvas{position:absolute;inset:-25%;width:150%;height:150%;display:block}
.orb.gl{cursor:pointer;touch-action:none}
.orb-wrap .orb.gl{transform:none!important}
.st-listening .orb.gl,.st-rec .orb.gl,.st-speaking .orb.gl{transform:none;animation:none}
.orb-wrap .halo{background:radial-gradient(circle,rgba(var(--surface-rgb),.55) 42%,rgba(var(--surface-rgb),0) 71%)}
.nav .assist{background:var(--surface);padding:9px}
.nav .assist .mini-orb{overflow:visible}

.toast.top{bottom:auto;top:calc(env(safe-area-inset-top) + 12px)}
.orb-pick{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}
.orb-pick button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px 10px;border-radius:16px;border:1.5px solid transparent;font-size:12px;font-weight:500;color:var(--ink2)}
.orb-pick button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-softer);color:var(--brand-deep)}
.orb-pick .op{width:46px;height:46px;position:relative;pointer-events:none}
.orb-pick .op .orb{position:absolute;inset:0;width:100%;border-radius:50%;box-shadow:none}
.orb-demo{display:grid;place-items:center;height:190px;margin-top:6px}
.orb-demo .orb{--orb:150px}
.sheet-x{position:absolute;right:14px;top:14px}
.cmt{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.cmt:last-child{border-bottom:0}
.cmt b{font-size:14px;font-weight:600}
.cmt small{color:var(--muted);font-size:12px;margin-left:6px;font-weight:400}
.cmt p{font-size:14.5px;line-height:1.45;color:var(--ink2);margin-top:2px}
.auth-switch button{padding:10px 4px;min-height:40px}

/* ---- Auth: fits one screen ---- */
.auth{min-height:100%;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 12px) var(--pad) 0}
.auth .brand{min-height:44px}
.auth h1{font-size:clamp(28px,8.2vw,34px);margin-top:14px;line-height:1.1}
.auth .sub{font-size:14.5px;margin-top:6px;line-height:1.45}
.auth .social{grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.auth .sbtn{height:50px;font-size:15px;gap:10px}
.auth .or{margin:16px 0 0}
.auth form{display:flex;flex-direction:column;flex:1}
.auth .field{margin-top:10px}
.auth .field span{margin-bottom:5px}
.auth .input{height:50px}
.auth .role-chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 calc(var(--pad)*-1);padding:0 var(--pad) 2px;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 var(--pad),#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 var(--pad),#000 calc(100% - 28px),transparent)}
.auth .role-chips::-webkit-scrollbar{display:none}
.auth .role-chips .chip{flex:none}
.auth .check{margin-top:12px;font-size:13px;line-height:1.4}
.auth .err{margin:8px 4px 0;min-height:0}
.auth .err:empty{display:none}
.auth .link{padding:6px 0;min-height:36px}
.auth-actions{position:sticky;bottom:0;margin-top:auto;padding:14px 0 calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(var(--bg-rgb),0),var(--bg) 14px)}
.auth-actions .auth-switch{margin-top:6px}
.auth-actions .btn{height:52px}
@media (max-height:760px){
  .auth{padding-top:calc(env(safe-area-inset-top) + 6px)}
  .auth h1{font-size:26px;margin-top:6px}
  .auth .sub{display:none}
  .auth .social{margin-top:12px}
  .auth .sbtn,.auth .input{height:46px}
  .auth .or{margin-top:10px}
  .auth .field{margin-top:6px}
  .auth .field span{margin-bottom:3px;font-size:12.5px}
  .auth .check{margin-top:8px;font-size:12.5px}
  .auth-actions{padding-top:10px}
  .auth-actions .btn{height:48px}
  .auth-actions .auth-switch{margin-top:2px}
}

/* ---------- Illustrated avatars & photos ---------- */
.avatar svg,.avatar img,.photo svg,.photo img,.av svg,.av img{width:100%;height:100%;display:block;object-fit:cover}
.photo .photo-edit{position:absolute;right:6px;bottom:6px;width:28px;height:28px;border-radius:50%;background:var(--surface);color:var(--ink);display:grid;place-items:center;box-shadow:var(--shadow-sm)}
.photo .photo-edit svg{width:15px;height:15px}
.av-pick{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:12px}
.av-pick button{aspect-ratio:1;border-radius:50%;overflow:hidden;border:3px solid transparent;transition:border-color .15s}
.av-pick button[aria-pressed="true"]{border-color:var(--brand-deep)}
.av-hero{display:flex;flex-direction:column;align-items:center;gap:10px;margin:8px 0 6px}
.av-hero .avatar{width:96px;height:96px}
/* ---------- Appearance ---------- */
.appr-h{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.02em;text-transform:uppercase;padding:22px var(--pad) 10px}
.mode-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 var(--pad)}
.mode-tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 8px 12px;border-radius:18px;border:2px solid var(--line);background:var(--surface);font-size:14px;font-weight:500}
.mode-tile[aria-checked="true"]{border-color:var(--brand-deep);box-shadow:0 0 0 3px var(--brand-soft)}
.mode-tile .mock{width:100%;aspect-ratio:.72;border-radius:12px;overflow:hidden;position:relative;border:1px solid rgba(0,0,0,.08)}
.mode-tile .mock i{position:absolute;left:10%;right:10%;height:9%;border-radius:6px}
.mode-tile small{font-size:12px;color:var(--muted);font-weight:400;margin-top:-4px}
.accent-row{display:flex;gap:14px;padding:0 var(--pad);flex-wrap:wrap}
.accent-sw{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);min-width:56px}
.accent-sw i{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.accent-sw i svg{width:18px;height:18px;opacity:0}
.accent-sw[aria-checked="true"] i{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--brand-deep)}
.accent-sw[aria-checked="true"] i svg{opacity:1}
.appr-card{margin:0 var(--pad);background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px}
.appr-card .orb-demo{height:170px}
.appr-card .orb-demo .orb{--orb:140px}
html[data-theme="dark"] .notif i.tint{color:var(--tint-fg-dark,var(--ink))!important}
html[data-theme="dark"] .scene-card,html[data-theme="dark"] .post-grid>div{box-shadow:none}
html[data-theme="dark"] .ibtn{box-shadow:none}
html[data-theme="dark"] .ring-card{box-shadow:none}
html[data-theme="dark"] .folder b,html[data-theme="dark"] .folder small,html[data-theme="dark"] .ncard,html[data-theme="dark"] .mcard b{color:var(--ink)}

/* ---- Calendar ---- */
.cal{margin:14px var(--pad) 0;padding:14px 12px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sm)}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal-head b{font-size:16px;font-weight:600}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));margin-top:8px;row-gap:2px}
.cal-dow{text-align:center;font-size:12px;font-weight:600;color:var(--muted);padding:6px 0}
.cal-day{height:44px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:15px;font-weight:500;color:var(--ink)}
.cal-day.is-out{color:var(--faint)}
.cal-day.is-today span:first-child{color:var(--brand-deep);font-weight:700}
.cal-day[aria-pressed="true"]{background:var(--brand-deep);color:var(--on-brand)}
.cal-day[aria-pressed="true"].is-today span:first-child{color:var(--on-brand)}
.cal-dots{display:flex;gap:3px;height:5px}
.cal-dots i,.cal-legend i,.agenda-row>i{width:5px;height:5px;border-radius:50%;display:block}
.dn{background:var(--ink2)}.dr{background:var(--brand)}.dm{background:var(--canyon)}
.cal-day[aria-pressed="true"] .cal-dots i{box-shadow:0 0 0 1.5px var(--on-brand)}
.cal-legend{display:flex;gap:16px;justify-content:center;margin-top:10px;font-size:12.5px;color:var(--muted)}
.cal-legend span{display:inline-flex;align-items:center;gap:6px}
.cal-legend i{width:8px;height:8px}
.agenda{margin:10px var(--pad) 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:2px 14px}
.agenda-row{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:10px 0;border-bottom:1px solid var(--line);text-align:left}
.agenda-row:last-child{border-bottom:0}
.agenda-row>i{width:10px;height:10px;flex:none}
.agenda-row .grow{flex:1;min-width:0}
.agenda-row b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agenda-row small{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agenda-row>svg{width:18px;height:18px;color:var(--faint);flex:none}

/* ---- Dark theme refinements ---- */
html[data-theme="dark"] .mhead,html[data-theme="dark"] .phead{background:linear-gradient(150deg,#34496E,#243248);color:#FFFFFF}
html[data-theme="dark"] .mhead .ibtn,html[data-theme="dark"] .phead .ibtn{background:rgba(255,255,255,.12);color:#FFFFFF}
html[data-theme="dark"] .pid .btn{background:var(--butter);color:#1E1E1E}
html[data-theme="dark"] .cap.big::before{background:repeating-conic-gradient(rgba(247,216,154,.10) 0 10deg,transparent 10deg 22deg)}
html[data-theme="dark"] .accent-sw i{box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
html[data-theme="dark"] .accent-sw[aria-checked="true"] i{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--brand-deep)}

[hidden]{display:none!important}

/* ================= Auth (references: Finora welcome/sign up, crypto login) ================= */
:root{--auth-disc:#E8EEF7;--auth-field:#F6F8FB;--auth-top-a:#DCE6F4;--auth-top-b:#B9C9E2}
html[data-theme="dark"]{--auth-disc:#2B3340;--auth-field:#2E2E2E;--auth-top-a:#2A3342;--auth-top-b:#1F2632}
.auth2{min-height:100%;display:flex;flex-direction:column;align-items:stretch;padding:calc(env(safe-area-inset-top) + 18px) var(--pad) calc(16px + env(safe-area-inset-bottom));position:relative;background:var(--bg)}
.auth-back{position:absolute;left:calc(var(--pad) - 8px);top:calc(env(safe-area-inset-top) + 12px);z-index:3}
.auth-title{font-family:"Outfit",system-ui,sans-serif;font-size:clamp(26px,7.4vw,30px);font-weight:600;letter-spacing:-.02em;text-align:center;line-height:1.15;color:var(--ink)}
.auth-sub{text-align:center;color:var(--muted);font-size:15px;line-height:1.5;margin:8px auto 0;max-width:30ch}
.auth-cta{height:54px;font-size:16px;font-weight:600}
.auth-or{display:flex;align-items:center;gap:14px;color:var(--muted);font-size:13.5px;margin:22px 0 16px}
.auth-or::before,.auth-or::after{content:"";flex:1;height:1px;background:var(--line)}
.auth-foot{text-align:center;color:var(--muted);font-size:14.5px;margin-top:auto;padding-top:18px}
.auth-foot button{color:var(--brand-deep);font-weight:600;padding:10px 2px;min-height:44px}
/* welcome */
.welcome{justify-content:flex-start}
.welcome-art{width:clamp(150px,44vw,190px);aspect-ratio:1;margin:clamp(16px,6dvh,56px) auto 0}
.welcome-art svg{width:100%;height:100%}
.welcome .auth-title{margin-top:26px}
.welcome .auth-cta{margin-top:30px}
.auth-providers{display:grid;gap:12px}
.prov{display:flex;align-items:center;justify-content:center;gap:12px;height:54px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:15.5px;font-weight:500;color:var(--ink);transition:background .15s}
.prov:hover{background:var(--soft)}
.prov svg{width:20px;height:20px}
.prov,.auth-ico{color:var(--ink)}
/* sign up */
.signup{padding-top:calc(env(safe-area-inset-top) + 14px)}
.su-avatar{position:relative;width:88px;height:88px;margin:4px auto 0;border-radius:50%;display:block}
.su-avatar .av-img{display:block;width:100%;height:100%;border-radius:50%;overflow:hidden;background:var(--auth-disc)}
.su-avatar .av-img svg,.su-avatar .av-img img{width:100%;height:100%;object-fit:cover;display:block}
.av-plus{position:absolute;right:-2px;top:2px;width:28px;height:28px;border-radius:50%;background:var(--brand-deep);color:var(--on-brand);display:grid;place-items:center;box-shadow:0 0 0 3px var(--bg)}
.av-plus svg{width:15px;height:15px}
.signup .auth-title{margin-top:14px}
.signup .auth-sub{margin-top:6px}
.auth-form{display:flex;flex-direction:column;margin-top:18px}
.f2{display:block;margin-top:12px}
.f2:first-child{margin-top:0}
.f2>span:first-child{display:block;font-size:13.5px;font-weight:500;color:var(--ink2);margin:0 0 6px 2px}
.f2 input,.fg-row input{width:100%;height:50px;border-radius:14px;border:1.5px solid transparent;background:var(--auth-field);padding:0 16px;font-size:15.5px;color:var(--ink);outline:0;transition:border-color .15s,background .15s,box-shadow .15s}
.f2 input::placeholder,.fg-row input::placeholder{color:var(--faint)}
.f2 input:focus{border-color:var(--brand);background:var(--surface);box-shadow:0 0 0 4px var(--brand-softer)}
.f2.bad input{border-color:var(--red)}
.f2 em,.lerr{display:block;font-style:normal;font-size:12.5px;color:var(--red);margin:5px 2px 0;min-height:0}
.f2 em:empty,.lerr:empty{display:none}
.pw{position:relative;display:block}
.pw input{padding-right:52px}
.pw-eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:44px;height:44px;color:var(--muted)}
.signup .auth-cta{margin-top:20px}
.auth-legal{text-align:center;font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.45}
.auth-legal button{display:inline;color:var(--ink2);text-decoration:underline;text-underline-offset:2px;padding:0;min-height:0;font-size:inherit;line-height:inherit}
.signup .auth-or{margin:16px 0 12px}
.auth-icons{display:flex;justify-content:center;gap:16px}
.auth-ico{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;box-shadow:var(--shadow-sm);transition:transform .15s}
.auth-ico:active{transform:scale(.94)}
.auth-ico svg{width:22px;height:22px}
.signup .auth-foot{padding-top:10px}
/* login */
.login{padding:0}
.login-top{position:relative;height:clamp(210px,36dvh,320px);background:radial-gradient(120% 90% at 50% 20%,var(--auth-top-a),var(--auth-top-b));overflow:hidden;flex:none}
.login-top .auth-back{background:rgba(var(--surface-rgb),.7);box-shadow:none;backdrop-filter:blur(8px)}
.login-art{position:absolute;inset:0}
.la-orb{position:absolute;left:50%;top:44%;--orb:clamp(96px,26dvh,150px);width:var(--orb);transform:translate(-50%,-50%);border-radius:50%}
.la-card{position:absolute;background:var(--surface);border-radius:14px;box-shadow:0 18px 30px -18px rgba(var(--shadow-rgb),.45);display:flex;flex-direction:column;gap:6px;padding:12px}
.la-card i{display:block;height:6px;border-radius:3px;background:var(--brand-soft);width:52px}
.la-a{left:9%;top:26%;transform:rotate(-12deg);animation:float 6s ease-in-out infinite}
.la-b{right:10%;top:18%;width:52px;height:52px;border-radius:50%;padding:0;align-items:center;justify-content:center;color:var(--brand-deep);transform:rotate(10deg);animation:float 7s ease-in-out -2s infinite}
.la-b svg{width:24px;height:24px}
.la-dot{position:absolute;border-radius:50%}
.la-c{width:22px;height:22px;background:var(--butter);right:22%;bottom:22%;animation:float 5s ease-in-out -1s infinite}
.la-d{width:12px;height:12px;background:var(--canyon);left:22%;bottom:30%;animation:float 6s ease-in-out -3s infinite}
.la-tri{position:absolute;left:14%;bottom:14%;width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-bottom:24px solid var(--olive);opacity:.85;transform:rotate(-14deg)}
@keyframes float{50%{translate:0 -8px}}
@media (prefers-reduced-motion:reduce){.la-card,.la-dot{animation:none}}
.login-card{position:relative;margin-top:-34px;flex:1;display:flex;flex-direction:column;background:var(--bg);border-radius:32px 32px 0 0;padding:26px var(--pad) calc(16px + env(safe-area-inset-bottom))}
.login .auth-title{text-align:center}
.login .auth-form{margin-top:20px}
.field-group{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:6px 12px;box-shadow:var(--shadow-sm);transition:border-color .15s}
.field-group:focus-within{border-color:var(--brand)}
.field-group.bad{border-color:var(--red)}
.fg-row{display:flex;align-items:center;gap:12px;position:relative;min-height:58px}
.fg-row+.fg-row{border-top:1px solid var(--line)}
.fg-row input{background:transparent;border:0;padding:0 44px 0 0;height:56px;border-radius:0;box-shadow:none!important}
.fg-row .pw-eye{right:-6px}
.fg-ico{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none}
.fg-ico svg{width:17px;height:17px}
.ic-a{background:var(--butter-soft,#FDF3DD);color:#8A6A1E}
.ic-b{background:var(--brand-soft);color:var(--brand-deep)}
html[data-theme="dark"] .ic-a{background:#3A3326;color:#F7D89A}
.lerr{margin:8px 4px 0}
.login-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px}
.login-row .link{font-size:14.5px;min-height:44px;padding:0 2px}
.login-row .btn{height:52px;padding:0 34px;font-weight:600}
.login .auth-or{margin:26px 0 16px}
@media (max-height:760px){
  .welcome-art{width:140px;margin-top:10px}
  .welcome .auth-title{margin-top:18px}
  .welcome .auth-cta{margin-top:22px}
  .auth-or{margin:16px 0 12px}
  .prov,.auth-cta{height:50px}
  .su-avatar{width:72px;height:72px}
  .signup .auth-title{margin-top:8px;font-size:25px}
  .signup .auth-sub{display:none}
  .auth-form{margin-top:12px}
  .f2{margin-top:8px}.f2>span:first-child{margin-bottom:4px;font-size:13px}
  .f2 input{height:46px}
  .signup .auth-cta{margin-top:14px}
  .signup .auth-or{margin:10px 0 8px}
  .auth-ico{width:46px;height:46px}
  .login-top{height:180px}
  .login-card{padding-top:20px}
  .login .auth-form{margin-top:14px}
  .fg-row{min-height:52px}.fg-row input{height:50px}
  .login .auth-or{margin:18px 0 12px}
}

/* ================= Rich text editor ================= */
.compose{min-height:100%;display:flex;flex-direction:column;background:var(--bg)}
.cm-top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;background:rgba(var(--bg-rgb),.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.cm-state{flex:1;text-align:center;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm-done{height:40px;padding:0 18px;font-weight:600}
.cm-scroll{flex:1;padding:18px var(--pad) 24px}
.cm-title{display:block;width:100%;border:0;outline:0;resize:none;background:transparent;font:600 clamp(24px,7vw,28px)/1.2 "Outfit",sans-serif;letter-spacing:-.02em;color:var(--ink);overflow:hidden}
.cm-title::placeholder{color:var(--faint)}
.cm-meta{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin:8px 0 14px}
.cm-meta svg{width:14px;height:14px}
.rt{min-height:46dvh;outline:0;font-family:var(--read);font-size:18px;line-height:1.65;color:var(--ink2);caret-color:var(--brand-deep);word-wrap:break-word}
.rt:focus{outline:0}
.rt>*:first-child{margin-top:0}
.rt p{margin:0 0 .8em}
.rt h1,.nv-body .rt-h1{font:700 1.6em/1.2 "Outfit",sans-serif;letter-spacing:-.02em;color:var(--ink);margin:1em 0 .45em}
.rt h2,.nv-body .rt-h2{font:600 1.3em/1.25 "Outfit",sans-serif;letter-spacing:-.015em;color:var(--ink);margin:1em 0 .4em}
.rt h3,.nv-body .rt-h3{font:600 1.08em/1.3 "Outfit",sans-serif;color:var(--ink);margin:.9em 0 .35em}
.rt ul,.rt ol{margin:0 0 .9em 1.4em}
.rt li{margin:.25em 0}
.rt blockquote,.nv-body .rt-quote{margin:.8em 0;padding:4px 0 4px 14px;border-left:3px solid var(--brand);color:var(--ink);font-style:italic}
.rt .rt-verse{font-style:italic;background:var(--brand-softer);border-radius:12px;padding:12px 14px;border-left:3px solid var(--brand);user-select:none}
.rt .rt-verse cite{display:block;font:500 12.5px "Outfit",sans-serif;color:var(--muted);margin-top:6px;font-style:normal}
.rt [data-illus]{font:14px/1.5 "Outfit",sans-serif;color:var(--muted);border-left:3px solid var(--faint);padding-left:12px}
.rt [data-poem]{font-style:italic}
.rt:empty::before,.rt>p:only-child:has(br:only-child)::before{content:attr(data-placeholder);color:var(--faint);pointer-events:none}
.rt>p:only-child:has(br:only-child)::before{content:"Start writing…"}
.rt-bar{position:sticky;bottom:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:0;padding:8px 6px calc(8px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.rt-bar::-webkit-scrollbar{display:none}
.rt-bar button{flex:none;min-width:30px;height:40px;padding:0 5px;border-radius:10px;display:grid;place-items:center;font:600 14px "Outfit",sans-serif;color:var(--ink2)}
.rt-bar button b{font-size:16px}.rt-bar button i{font-size:17px;font-weight:600}
.rt-bar button svg{width:19px;height:19px}
.rt-bar button[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand-deep)}
.rt-sep{width:1px;height:20px;background:var(--line);margin:0 2px;flex:none}
.nv-body .rt-h1,.nv-body .rt-h2,.nv-body .rt-h3{font-family:"Outfit",sans-serif}
.nv-body b{color:var(--ink);font-weight:600}
.nv-pub{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:13px;font-weight:500;color:var(--brand-deep);text-decoration:none;background:var(--brand-softer);padding:6px 10px;border-radius:99px}
.nv-pub svg{width:14px;height:14px}
/* ================= OAuth window ================= */
.oauth{position:absolute;inset:0;z-index:95;background:rgba(var(--scrim-rgb),.45);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s}
.oauth.open{opacity:1}
.oauth-win{width:100%;max-height:92%;overflow:auto;background:#fff;color:#1F1F1F;border-radius:22px 22px 0 0;transform:translateY(24px);transition:transform .25s;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.oauth.open .oauth-win{transform:none}
.oauth-win.dark{background:#1C1C1E;color:#F5F5F7}
.oauth-bar{display:flex;align-items:center;gap:8px;padding:12px 10px 12px 16px;border-bottom:1px solid rgba(0,0,0,.08);font-size:13px;color:#5F6368}
.oauth-win.dark .oauth-bar{border-color:rgba(255,255,255,.1);color:#A1A1A6}
.oauth-bar svg{width:14px;height:14px}
.oauth-bar span{flex:1}
.oauth-x{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;color:inherit}
.oauth-x svg{width:18px;height:18px}
.oauth-body{padding:22px 22px 6px;text-align:center}
.oauth-load{padding:40px 0 50px;color:#5F6368}
.oauth-load p{margin-top:14px;font-size:14.5px}
.spin{display:inline-block;width:30px;height:30px;border-radius:50%;border:3px solid rgba(0,0,0,.1);border-top-color:#1A73E8;animation:spin .8s linear infinite}
.oauth-win.dark .spin{border-color:rgba(255,255,255,.15);border-top-color:#fff}
.oauth-logo{display:grid;place-items:center}
.oauth-logo svg{width:40px;height:40px}
.oauth-body h3{font-size:22px;font-weight:500;margin-top:12px;color:inherit}
.oauth-sub{font-size:15px;margin-top:6px;opacity:.8}
.oauth-acct{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid rgba(0,0,0,.12);border-radius:14px;padding:10px 12px;margin:18px 0 12px}
.oauth-win.dark .oauth-acct{border-color:rgba(255,255,255,.14)}
.oauth-av{width:40px;height:40px;border-radius:50%;overflow:hidden;flex:none}
.oauth-av svg{width:100%;height:100%}
.oauth-acct b{display:block;font-size:15px;font-weight:600}
.oauth-acct small{font-size:13px;opacity:.7}
.oauth-scopes{list-style:none;text-align:left;display:grid;gap:8px;font-size:14px;margin:6px 2px}
.oauth-scopes li{display:flex;gap:8px;align-items:flex-start}
.oauth-scopes svg{width:16px;height:16px;color:#1A73E8;flex:none;margin-top:2px}
.oauth-win.dark .oauth-scopes svg{color:#0A84FF}
.oauth-demo{display:flex;gap:8px;align-items:flex-start;text-align:left;font-size:12.5px;line-height:1.4;background:rgba(26,115,232,.08);color:inherit;border-radius:10px;padding:10px;margin-top:14px}
.oauth-demo svg{width:15px;height:15px;flex:none;margin-top:1px}
.oauth-actions{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-top:16px}
.oauth-actions .btn{height:48px}
.oauth-win .btn.line{background:transparent;border:1px solid rgba(0,0,0,.15);color:inherit}
.oauth-win.dark .btn.line{border-color:rgba(255,255,255,.2)}
.oauth-win:not(.dark) .btn.primary{background:#1A73E8;color:#fff;box-shadow:none}
.oauth-win.dark .btn.primary{background:#fff;color:#000;box-shadow:none}
/* ================= Publish ================= */
.blog-logo{display:grid;place-items:center;border-radius:12px;color:#fff;font-weight:700;font-family:Georgia,serif;flex:none}
.pb-list{display:grid;gap:8px;margin-top:14px}
.pb-row{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:16px;padding:8px 10px 8px 8px;transition:border-color .15s}
.pb-row.on{border-color:var(--brand)}
.pb-main{flex:1;display:flex;align-items:center;gap:12px;text-align:left;min-width:0;min-height:44px}
.pb-main:disabled{cursor:default;opacity:1}
.pb-main b{display:block;font-size:15px;font-weight:600}
.pb-main small{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb-main>span:nth-child(2){flex:1;min-width:0}
.pb-radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--faint);flex:none}
.pb-row.on .pb-radio{border:6px solid var(--brand-deep)}
.pb-x{font-size:13px;color:var(--muted)}
.pb-done{text-align:center;padding:6px 0}
.pb-done .blog-logo{margin:4px auto 12px}
.pb-url{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:12px;padding:10px 12px;margin-top:14px;font-size:13px;color:var(--ink2);text-align:left}
.pb-url span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pb-url svg{width:15px;height:15px;flex:none}
@media (min-width:380px){.rt-bar button{min-width:32px;padding:0 6px}}
</style>

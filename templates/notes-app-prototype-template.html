let locCache=null;
function getPlace(){
  return new Promise(res=>{
    if(!S.prefs.tagLocation) return res(null);
    if(locCache && Date.now()-locCache.t<10*60e3) return res(locCache.v);
    if(!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(async p=>{
      let v=null;
      try{
        const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${p.coords.latitude}&lon=${p.coords.longitude}&zoom=10`,{headers:{"Accept-Language":"en"}});
        const d=await r.json(),a=d.address||{};
        const city=a.city||a.town||a.state||a.county||a.village;
        const country=a.country_code==="us"?"USA":a.country_code==="gb"?"UK":a.country;
        v=[city,country].filter(Boolean).join(", ")||null;
      }catch(e){ v=`${p.coords.latitude.toFixed(2)}, ${p.coords.longitude.toFixed(2)}`; }
      locCache={t:Date.now(),v}; res(v);
    },()=>res(null),{timeout:9000,maximumAge:600000});
  });
}

const NUMW={one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10};
const ORD={first:1,firstly:1,second:2,secondly:2,third:3,thirdly:3,fourth:4,fifth:5};
const BOOKS="Genesis|Exodus|Leviticus|Numbers|Deuteronomy|Joshua|Judges|Ruth|Samuel|Kings|Chronicles|Nehemiah|Esther|Job|Psalms?|Proverbs|Isaiah|Jeremiah|Lamentations|Ezekiel|Daniel|Hosea|Joel|Amos|Micah|Habakkuk|Malachi|Matthew|Mark|Luke|John|Acts|Romans|Corinthians|Galatians|Ephesians|Philippians|Colossians|Thessalonians|Timothy|Titus|Hebrews|James|Peter|Jude|Revelation";
const REF_RE=new RegExp(`\\b((?:[123]\\s)?(?:${BOOKS}))\\s+(?:chapter\\s+)?(\\d{1,3})(?:\\s*(?::|verse|verses|v\\.?)\\s*(\\d{1,3}))?`,"i");
const cap=s=>s? s.charAt(0).toUpperCase()+s.slice(1):s;
const escRe=s=>s.replace(/[.*+?^$(){}|[\]\\]/g,"\\$&");

function structure(raw,mode="talk"){
  if(mode==="poetry"){
    const lines=raw.replace(/\s+/g," ").split(/(?<=[,.;!?])\s+/).map(s=>s.trim()).filter(Boolean);
    const fl=(lines[0]||"").replace(/[,.;!?]$/,"").split(" ");

  }

    const ss=clean.split(/(?<=[.!?])\s+/).map(x=>cap(x.trim().replace(/^(and|next|also|then),?\s+/i,""))).filter(x=>x.length>3);
    const G={"Done":[],"Up next":[],"Blockers":[],"Action items":[],"Discussion":[]};
    ss.forEach(x=>{ const y=cap(x.replace(/^(the |my )?(action item|todo|to-do) (is|was)( that)?,?\s*/i,"").replace(/[.]$/,""));
      if(/action item|will (follow up|send|share|email|call|review|prepare|update)|by (monday|tuesday|wednesday|thursday|friday|next week|tomorrow)/i.test(x)) G["Action items"].push(y);
      else if(/blocker|blocked|waiting on|we are still waiting|stuck/i.test(x)) G["Blockers"].push(y.replace(/^my blocker is /i,"Blocked on "));
      else if(/yesterday|finished|completed|done with|shipped/i.test(x)) G["Done"].push(y.replace(/^yesterday,?\s*/i,"").replace(/^i /,"I "));
      else if(/today|will start|going to|next up|plan to/i.test(x)) G["Up next"].push(y.replace(/^today,?\s*/i,""));
      else G["Discussion"].push(y); });
    const blocks=[]; Object.entries(G).forEach(([h,xs])=>{ if(xs.length){ blocks.push({t:"h",x:h}); blocks.push({t:"ul",x:xs.map(x=>cap(x))}); } });
    return {title:"Team meeting",blocks:blocks.length?blocks:[{t:"p",x:clean}]};
  }
  // delivery-only language
  t=t.replace(/\b(ladies and gentlemen|good (morning|afternoon|evening)( (everyone|church|all|family))?|thank you( so much)?( for having me| all| everyone)?|can i get an amen|somebody say amen|say amen|give (god|him) a hand|turn to your neighbou?r[^.?!]*|turn (with me )?(in your bibles? )?to|open your bibles? to|let's read|let us read|raise your hands?[^.?!]*|(class|church|everyone|guys),? (settle down|quiet down|let's begin)|alright|let me tell you|you know what|listen to me)\b[,!.?]?/gi," ");
  t=t.replace(/\b(um+|uh+|er+|ah+|hmm+|you know,?|i mean,?|like,)\s*/gi,"");
  t=t.replace(/\b(\w+)(,?\s+\1\b)+/gi,"$1");
  t=t.replace(/\s+([,.!?])/g,"$1").replace(/([,.!?]){2,}/g,"$1").replace(/^[\s,.!?]+/,"").trim();
  const sents=t.split(/(?<=[.!?])\s+/).map(s=>s.trim().replace(/^(and|so|okay|alright|now),?\s+/i,"")).filter(s=>s.replace(/[^a-z]/gi,"").length>2);
  const blocks=[]; let para=[], list=null, verses=[], title=null;
  const flushPara=()=>{ if(!para.length) return;
    // condense a run of "Sometimes ..." sentences into one sentence
    const out=[]; for(let i=0;i<para.length;i++){ if(/^sometimes\b/i.test(para[i])){ const run=[]; while(i<para.length&&/^sometimes\b/i.test(para[i])){run.push(para[i].replace(/[.!?]$/,""));i++} i--;
        if(run.length>1){ const rest=run.slice(1).map(r=>r.replace(/^sometimes\s+/i,"")); const last=rest.pop(); out.push(`${run[0]}${rest.length?", "+rest.join(", "):""}, or ${last}.`);} else out.push(run[0]+"."); }
      else out.push(para[i]); }
    for(let i=0;i<out.length;i+=3) blocks.push({t:"p",x:out.slice(i,i+3).join(" ")}); para=[]; };
  const flushList=()=>{ if(list&&list.x.length) blocks.push(list); list=null; verses.forEach(v=>blocks.push(v)); verses=[]; };
  const takeRefs=s=>{ const found=[]; let m, guard=0;
    while((m=s.match(REF_RE))&&guard++<5){ const ref=normRef(m);
      if(!verses.find(v=>v.ref===ref)&&!blocks.find(b=>b.ref===ref)) verses.push({t:"verse",ref,x:KJV[ref]||""});
      const tok=`@@${found.length}@@`; found.push(ref);
      s=s.replace(new RegExp(`,?\\s*(because\\s+)?(as\\s+)?(in\\s+)?${escRe(m[0])}\\s*(says|said|tells us)?,?[^.!?]*`,"i"),` ${tok}`); }
    s=s.replace(/@@(\d+)@@/g,(_,i)=>`(${found[i]})`);
    return s.replace(/\s+\(/g," (").replace(/\s+([.!?])$/,"$1"); };
  const intro=/^(here (are|is)|i('m| am) going to (share|give you)|let me share|there are)\s+(\w+)\s+(tips|ways|steps|stages|parts|types|kinds|points|things|reasons|keys|lessons|truths|habits|principles)\b\s*(on|for|to|about|of)?\s*(.*)$/i;
  const marker=/^(number\s+(one|two|three|four|five|six|seven|eight|nine|ten|\d+)|point\s+(one|two|three|four|five|\d+)|(first|second|third|fourth|fifth)(ly)?|the (next|last|final) (one|point|tip|step) is)\b[,:]?\s*/i;
  const softMarker=/^(next|lastly|finally)\b[,:]?\s*/i;
  for(let s of sents){
    const mi=s.match(intro);
    if(mi){ flushPara(); flushList(); const n=NUMW[mi[5].toLowerCase()]||mi[5]; const topic=(mi[8]||"").replace(/[.!?:]$/,"");
      blocks.push({t:"h",x:cap(`${n} ${mi[6].toLowerCase()}${topic?" "+(mi[7]||"on").toLowerCase()+" "+topic:""}`)});
      if(!title&&topic&&/^(on|about|to|for how)$/i.test(mi[7]||"")||(!title&&/^how to/i.test(topic))) title=cap(topic); list={t:"ol",x:[]}; continue; }
    let mm=s.match(marker); if(!mm&&list&&list.x.length) mm=s.match(softMarker);
    if(mm){ flushPara(); if(!list) list={t:"ol",x:[]}; let item=s.slice(mm[0].length).replace(/^(is|be|would be)\s+(to\s+)?/i,""); item=cap(takeRefs(item)); list.x.push(item); continue; }
    if(list && list.x.length && !/^(in conclusion|to conclude|remember|so remember|this week|as you go|go and|let'?s|my (challenge|charge)|today|tonight|in summary)\b/i.test(s) && s.split(" ").length<22 && !/[?]$/.test(s)){ // digression stays with its point
      list.x[list.x.length-1]+=" "+takeRefs(s); continue; }
    if(list) flushList();
    const tm=s.match(/^(today )?(we are|we're|i am|i'm|we will be|i will be) (talking|speaking|teaching|looking|learning) (about|on|at)\s+(.+?)[.!?]?$/i); if(tm&&!title) title=cap(tm[5]);
    s=takeRefs(s.replace(/^(in conclusion|to conclude),?\s*/i,"").replace(/^so\s+/i,""));
    if(/^\s*\([^()]*\)[.!?]?\s*$/.test(s)) continue;
    para.push(cap(s));
  }
  flushPara(); flushList(); verses.forEach(v=>blocks.push(v));
  if(!title){ const first=(blocks.find(b=>b.t==="p")?.x||"New note").replace(/[.!?].*$/,""); title=cap(first.split(" ").slice(0,6).join(" ")); }
  return {title,blocks:blocks.length?blocks:[{t:"p",x:cap(raw.trim())}]};
}
function autoSummary(blocks){
  const paras=blocks.filter(b=>b.t==="p").map(b=>b.x), lists=blocks.filter(b=>b.t==="ol"||b.t==="ul").flatMap(b=>b.x), head=blocks.find(b=>b.t==="h");
  const firstS=(paras[0]||lists[0]||"").split(/(?<=[.!?])\s/)[0];
  const numbered=head&&/^\d+\s/.test(head.x);
  const quick=paras.length?`${firstS}${numbered?` It shares ${head.x.charAt(0).toLowerCase()+head.x.slice(1)}.`:""}${paras.length>1?" "+paras[paras.length-1].split(/(?<=[.!?])\s/)[0]:""}`.trim()
    : blocks.filter(b=>b.t==="h").map(h=>{const i=blocks.indexOf(h),nx=blocks[i+1];return nx&&Array.isArray(nx.x)?`${h.x}: ${nx.x.join("; ")}.`:""}).filter(Boolean).join(" ")||lists.slice(0,3).join("; ");
  const short=x=>x.replace(/\s*\(.*?\)/g,"").split(/[,;:]| so | because /)[0].replace(/[.!?]$/,"");
  const take=(lists.length?lists:paras).slice(0,5).map(short);
  const actSec=blocks.findIndex(b=>b.t==="h"&&/action/i.test(b.x));
  const act=actSec>=0&&blocks[actSec+1]?.x?blocks[actSec+1].x.slice(0,3):lists.filter(x=>/^(before|put|drink|write|spend|choose|pick|set|read|review|pray|practice|call|send|make|start|stop|keep|remember|try|take|follow|share|build|check)/i.test(x)).slice(0,3).map(short);
  return {quick,take,act:act.length?act:["Review this note before your next session"]};
}

function signIn(name,email,via,photo){
  const prev=S.user&&S.user.email&&S.user.email===email?S.user:null;
  S.user={...(prev||{}),name,email,via,plan:prev?.plan||"Free",joined:prev?.joined||new Date().toISOString()};
  if(photo) S.user.photo=photo;
  if(email) S.lastEmail=email;
  S.onboarded=true; pendingPhoto=null; save();
  history_=[]; go("home",{}, {replace:true});
  setTimeout(()=>toast(prev?`Welcome back, ${name.split(" ")[0]}`:`Welcome, ${name.split(" ")[0]}`),300);
}
/* =========================================================
   OAUTH: Google & Apple sign-in, blog platform connections.
   With real credentials in AUTH_CONFIG the official SDKs are used.
   Without them (this demo file) the same redirect → consent → return
   flow is shown with a clearly labelled demo account. No forms.
   ========================================================= */
const AUTH_CONFIG={ googleClientId:"", appleServiceId:"", appleRedirectURI:"" };
function loadScript(src){ return new Promise((res,rej)=>{ if(document.querySelector(`script[src="${src}"]`)) return res(); const sc=document.createElement("script"); sc.src=src; sc.async=true; sc.onload=res; sc.onerror=rej; document.head.appendChild(sc); }); }
const jwtPayload=t=>{ try{ return JSON.parse(decodeURIComponent(atob(t.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")).split("").map(c=>"%"+("00"+c.charCodeAt(0).toString(16)).slice(-2)).join(""))); }catch(e){ return {}; } };
function oauthWindow({domain,logo,brand,title,sub,account,scopes,cta="Continue",dark=false}){
  return new Promise(resolve=>{
    const host=document.createElement("div"); host.className="oauth"; host.setAttribute("role","dialog"); host.setAttribute("aria-modal","true"); host.setAttribute("aria-label",title);
    host.innerHTML=`<div class="oauth-win ${dark?"dark":""}"><div class="oauth-bar">${ic("lock")}<span>${esc(domain)}</span><button class="oauth-x" data-o="cancel" aria-label="Cancel sign-in">${ic("x")}</button></div>
      <div class="oauth-body"><div class="oauth-load"><span class="spin"></span><p>Connecting securely to ${esc(brand)}…</p></div></div></div>`;
    $("#app").appendChild(host); requestAnimationFrame(()=>host.classList.add("open"));
    const done=v=>{ host.classList.remove("open"); setTimeout(()=>host.remove(),250); resolve(v); };
    host.addEventListener("click",e=>{ if(e.target===host||e.target.closest('[data-o="cancel"]')) done(null); if(e.target.closest('[data-o="ok"]')){ const btn=e.target.closest('[data-o="ok"]'); btn.disabled=true; btn.textContent="Signing in…"; setTimeout(()=>done(account),650); } });
    setTimeout(()=>{ if(!host.isConnected) return;
      host.querySelector(".oauth-body").innerHTML=`<div class="oauth-logo">${logo}</div><h3>${esc(title)}</h3><p class="oauth-sub">${sub}</p>
        <div class="oauth-acct"><span class="oauth-av">${avatarSVG(account.name)}</span><span><b>${esc(account.name)}</b><small>${esc(account.email||account.site||"")}</small></span></div>
        <ul class="oauth-scopes">${scopes.map(x=>`<li>${ic("check")}${esc(x)}</li>`).join("")}</ul>
        <p class="oauth-demo">${ic("info")}Demo account. Add your ${esc(brand)} app credentials to use real accounts.</p>
        <div class="oauth-actions"><button class="btn line" data-o="cancel">Cancel</button><button class="btn primary" data-o="ok">${esc(cta)}</button></div>`;
      host.querySelector('[data-o="ok"]').focus();
    },800);
  });
}
async function providerSheet(p){
  if(p==="google"){
    if(AUTH_CONFIG.googleClientId){
      try{ await loadScript("https://accounts.google.com/gsi/client");
        google.accounts.id.initialize({client_id:AUTH_CONFIG.googleClientId,callback:r=>{ const d=jwtPayload(r.credential); if(d.email) signIn(d.name||d.email.split("@")[0],d.email,"Google",d.picture); },ux_mode:"popup",use_fedcm_for_prompt:true});
        google.accounts.id.prompt(nt=>{ if(nt.isNotDisplayed?.()||nt.isSkippedMoment?.()) toast("Google sign-in was closed"); });
      }catch(e){ toast("Couldn't reach Google. Check your connection."); }
      return;
    }
    const acct=await oauthWindow({domain:"accounts.google.com",logo:LOGO.google,brand:"Google",title:"Sign in with Google",sub:"Choose an account to continue to <b>Your App</b>",account:{name:"Demo Account",email:"demo.account@gmail.com"},scopes:["Your name and profile picture","Your email address"]});
    if(acct) signIn(acct.name,acct.email,"Google"); return;
  }
  if(p==="apple"){
    if(AUTH_CONFIG.appleServiceId){
      try{ await loadScript("https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/1/en_US/appleid.auth.js");
        AppleID.auth.init({clientId:AUTH_CONFIG.appleServiceId,scope:"name email",redirectURI:AUTH_CONFIG.appleRedirectURI,usePopup:true});
        const r=await AppleID.auth.signIn(); const d=jwtPayload(r.authorization.id_token); const nm=r.user?.name?`${r.user.name.firstName||""} ${r.user.name.lastName||""}`.trim():""; signIn(nm||S.user?.name||"Apple user",d.email||"","Apple");
      }catch(e){ if(e?.error!=="popup_closed_by_user") toast("Apple sign-in didn't complete"); }
      return;
    }
    const acct=await oauthWindow({domain:"appleid.apple.com",logo:LOGO.apple,brand:"Apple",title:"Sign in with Apple",sub:"Use your Apple Account to sign in to <b>Your App</b>",account:{name:"Demo Account",email:"Hide My Email · private relay"},scopes:["Your name","Your email (you can hide it)"],cta:"Continue with Face ID",dark:true});
    if(acct) signIn(acct.name,`${uid()}@privaterelay.appleid.com`,"Apple"); return;
  }
}

/* =========================================================
   PUBLISH TO BLOGGING PLATFORMS
   ========================================================= */
const BLOGS={
  wordpress:{name:"WordPress",bg:"#21759B",t:"W",domain:"public-api.wordpress.com",site:"yourblog.wordpress.com",url:(site,slug)=>`https://${site}/${new Date().toISOString().slice(0,10).replace(/-/g,"/")}/${slug}/`,scopes:["Create and publish posts","Upload images to your media library"]},
  blogger:{name:"Blogger",bg:"#F57D00",t:"B",domain:"accounts.google.com",site:"yourblog.blogspot.com",url:(site,slug)=>`https://${site}/${new Date().getFullYear()}/${String(new Date().getMonth()+1).padStart(2,"0")}/${slug}.html`,scopes:["Manage your Blogger posts"]},
  webflow:{name:"Webflow",bg:"#146EF5",t:"W",domain:"webflow.com",site:"your-site.webflow.io",url:(site,slug)=>`https://${site}/post/${slug}`,scopes:["Create items in your Blog Posts collection","Publish your site"]},
  tumblr:{name:"Tumblr",bg:"#001935",t:"t",domain:"www.tumblr.com",site:"yourblog.tumblr.com",url:(site,slug)=>`https://${site}/post/${Date.now()%1e11}/${slug}`,scopes:["Create posts on your blogs"]}
};
const blogLogo=(k,sz=40)=>`<span class="blog-logo" style="background:${BLOGS[k].bg};width:${sz}px;height:${sz}px;font-size:${Math.round(sz*.45)}px">${BLOGS[k].t}</span>`;
async function connectBlog(k){
  const bl=BLOGS[k];
  const acct=await oauthWindow({domain:bl.domain,logo:blogLogo(k,52),brand:bl.name,title:`Connect ${bl.name}`,sub:`<b>Your App</b> wants to publish to your ${bl.name} blog`,account:{name:S.user?.name||"Your account",site:bl.site},scopes:bl.scopes,cta:"Allow"});
  if(!acct) return false;
  S.blogs=S.blogs||{}; S.blogs[k]={site:bl.site,connected:new Date().toISOString()}; save(); toast(`${bl.name} connected`); return true;
}
function publishSheet(n,{fromEditor=false}={}){
  ensureBlocks(n); S.blogs=S.blogs||{};
  const connected=Object.keys(BLOGS).filter(k=>S.blogs[k]);
  let pick=connected[0]||null, status="public";
  const words=noteText(n).trim().split(/\s+/).filter(Boolean).length;
  const draw=b=>{
    b.querySelector("#pbList").innerHTML=Object.keys(BLOGS).map(k=>{const on=!!S.blogs[k];return `<div class="pb-row ${pick===k?"on":""}">
      <button class="pb-main" data-pick="${k}" ${on?"":"disabled"} aria-pressed="${pick===k}">${blogLogo(k)}<span><b>${BLOGS[k].name}</b><small>${on?esc(S.blogs[k].site):"Not connected"}</small></span>${on?`<i class="pb-radio"></i>`:""}</button>
      ${on?`<button class="link pb-x" data-disc="${k}" aria-label="Disconnect ${BLOGS[k].name}">Disconnect</button>`:`<button class="btn soft sm" data-conn="${k}">Connect</button>`}</div>`}).join("");
    b.querySelector("#pbGo").disabled=!pick;
    b.querySelector("#pbGo").textContent=pick?`${status==="draft"?"Save draft to":"Publish to"} ${BLOGS[pick].name}`:"Connect a platform to publish";
    b.querySelectorAll("[data-pick]").forEach(x=>x.onclick=()=>{pick=x.dataset.pick;draw(b)});
    b.querySelectorAll("[data-conn]").forEach(x=>x.onclick=async()=>{ if(await connectBlog(x.dataset.conn)){ pick=x.dataset.conn; draw(b); } });
    b.querySelectorAll("[data-disc]").forEach(x=>x.onclick=()=>{ delete S.blogs[x.dataset.disc]; save(); if(pick===x.dataset.disc) pick=Object.keys(BLOGS).find(k=>S.blogs[k])||null; draw(b); toast("Disconnected"); });
  };
  openSheet(`<button class="ibtn flat sheet-x" data-close aria-label="Close">${ic("x")}</button><h3>Publish to a blog</h3>
    <p class="muted" style="font-size:14px;margin-top:4px">${words} words · headings, bold and italics are kept</p>
    <div id="pbList" class="pb-list"></div>
    <label class="f2" style="margin-top:16px"><span>Post title</span><input id="pbTitle" value="${esc(n.title||"")}" placeholder="Give your post a title" maxlength="140"></label>
    <label class="f2"><span>Tags</span><input id="pbTags" value="${esc((n.labels||[]).join(", "))}" placeholder="faith, leadership, study notes"></label>
    <div class="seg" role="group" aria-label="Visibility" style="margin-top:14px"><button data-vis="public" aria-selected="true">Publish now</button><button data-vis="draft" aria-selected="false">Save as draft</button></div>
    <p id="pbErr" class="lerr" role="alert"></p>
    <button class="btn primary block" id="pbGo" style="margin-top:14px">Publish</button>`,{onOpen:b=>{
      draw(b);
      b.querySelectorAll("[data-vis]").forEach(x=>x.onclick=()=>{status=x.dataset.vis;b.querySelectorAll("[data-vis]").forEach(y=>y.setAttribute("aria-selected",y===x));draw(b)});
      b.querySelector("#pbGo").onclick=()=>{
        const t=b.querySelector("#pbTitle").value.trim(); if(!t){ b.querySelector("#pbErr").textContent="Add a title for your post."; b.querySelector("#pbTitle").focus(); return; }
        if(!(n.blocks||[]).length&&n.type!=="list"){ b.querySelector("#pbErr").textContent="This note is empty."; return; }
        const tags=b.querySelector("#pbTags").value.split(",").map(x=>x.trim()).filter(Boolean);
        const k=pick, bl=BLOGS[k], slug=t.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,60)||"post";
        const payload={title:t,content_html:blocksToHTML(n.type==="list"?[{t:"ul",x:n.items.map(i=>i.t)}]:n.blocks),content_markdown:blocksToMarkdown(n.blocks),tags,status};
        const steps=["Formatting headings and text","Uploading to "+bl.name,status==="draft"?"Saving draft":"Publishing post"];
        b.querySelector(".sheet").innerHTML=`<div class="grab"></div><h3>${status==="draft"?"Saving draft":"Publishing"}…</h3><ul class="steps" id="pbSteps">${steps.map(x=>`<li><i>${ic("check",'stroke-width="3"')}</i>${esc(x)}</li>`).join("")}</ul>`;
        const lis=[...b.querySelectorAll("#pbSteps li")]; let i=0;
        const tick=()=>{ if(i>0) lis[i-1].className="done"; if(i<lis.length){ lis[i].className="doing"; i++; setTimeout(tick,650); return; }
          const url=bl.url(S.blogs[k].site,slug);
          n.published=n.published||[]; n.published.push({platform:k,url,status,title:t,tags,date:new Date().toISOString(),bytes:payload.content_html.length}); save();
          b.querySelector(".sheet").innerHTML=`<div class="grab"></div><div class="pb-done">${blogLogo(k,56)}<h3>${status==="draft"?"Draft saved":"Your post is live"}</h3><p class="muted">${esc(t)}</p><div class="pb-url">${ic("link")}<span>${esc(url)}</span></div>
            <div style="display:grid;gap:10px;margin-top:16px"><button class="btn primary block" id="pbOpen">${status==="draft"?"Open draft":"View post"}</button><button class="btn line block" id="pbCopy">${ic("copy")}Copy link</button></div></div>`;
          b.querySelector("#pbCopy").onclick=()=>copyText(url);
          b.querySelector("#pbOpen").onclick=()=>{ window.open(url,"_blank","noopener"); };
          if(route.name==="noteView"){ const y=stage.firstElementChild?.scrollTop||0; render("none"); stage.firstElementChild.scrollTop=y; }
          else if(fromEditor){ go("noteView",{id:n.id},{replace:true}); }
        };
        tick();
      };
    }});
}

function setFieldError(form,name,msg){
  const inp=form.querySelector(`[name="${name}"]`), em=form.querySelector(`#e-${name}`);
  if(inp){ inp.setAttribute("aria-invalid",msg?"true":"false"); inp.closest(".f2")?.classList.toggle("bad",!!msg); }
  if(em) em.textContent=msg||"";
  return !msg;
}
AFTER.signup=(page)=>{
  const f=page.querySelector("#signupForm"), file=page.querySelector("#suFile");
  page.querySelector("#suAvatar").onclick=()=>file.click();
  file.onchange=async()=>{ const fl=file.files[0]; if(!fl) return; if(!fl.type.startsWith("image/")){toast("Choose an image file");return;}
    try{ pendingPhoto=await resizeImage(fl); page.querySelector("#suAvImg").innerHTML=`<img src="${pendingPhoto}" alt="">`; page.querySelector("#suAvatar").setAttribute("aria-label","Change profile photo"); toast("Photo added"); }catch(e){ toast("Couldn't read that image"); } };
  const nameIn=f.querySelector('[name="name"]'); let t;
  nameIn.addEventListener("input",()=>{ clearTimeout(t); t=setTimeout(()=>{ if(!pendingPhoto) page.querySelector("#suAvImg").innerHTML=avatarSVG(nameIn.value.trim()||"Your App new user"); },250); });
  f.querySelectorAll("input").forEach(i=>i.addEventListener("input",()=>setFieldError(f,i.name,"")));
  f.onsubmit=e=>{ e.preventDefault(); const d=Object.fromEntries(new FormData(f));
    const ok=[setFieldError(f,"name",d.name?.trim()?"":"Enter your name."),
      setFieldError(f,"email",/^\S+@\S+\.\S+$/.test(d.email||"")?"":"Enter a valid email address."),
      setFieldError(f,"pw",(d.pw||"").length>=8?"":"Use at least 8 characters.")];
    if(ok.includes(false)){ f.querySelector('[aria-invalid="true"]')?.focus(); return; }
    const btn=f.querySelector('[type="submit"]'); btn.disabled=true; btn.textContent="Creating account…";
    setTimeout(()=>signIn(d.name.trim(),d.email.trim(),"email",pendingPhoto),500);
  };
};
AFTER.login=(page)=>{
  const f=page.querySelector("#loginForm"), err=page.querySelector("#e-lerr");
  f.querySelectorAll("input").forEach(i=>i.addEventListener("input",()=>{err.textContent="";f.querySelectorAll("input").forEach(x=>x.removeAttribute("aria-invalid"));page.querySelector(".field-group").classList.remove("bad")}));
  f.onsubmit=e=>{ e.preventDefault(); const d=Object.fromEntries(new FormData(f));
    const bad=(name,msg)=>{ err.textContent=msg; const i=f.querySelector(`[name="${name}"]`); i.setAttribute("aria-invalid","true"); page.querySelector(".field-group").classList.add("bad"); i.focus(); };
    if(!/^\S+@\S+\.\S+$/.test(d.email||"")) return bad("email","Enter a valid email address.");
    if((d.pw||"").length<6) return bad("pw","Enter your password.");
    const btn=f.querySelector('[type="submit"]'); btn.disabled=true; btn.textContent="Logging in…";
    const n=S.user?.email===d.email?S.user.name:cap(d.email.split("@")[0].replace(/[._\d]+/g," ").trim())||"Friend";
    setTimeout(()=>signIn(n,d.email.trim(),"email"),450);
  };
  requestAnimationFrame(()=>{ const o=Orb.get(page.querySelector(".la-orb")); if(o){ let t0=performance.now(); const tick=()=>{ if(!page.isConnected) return; const t=(performance.now()-t0)/1000; o.set({state:"speaking",outputVolume:.25+.2*Math.abs(Math.sin(t*1.6))}); requestAnimationFrame(tick); }; tick(); } });
};

/* =========================================================
   RICH TEXT: safe inline HTML, plain text, markdown
   ========================================================= */
const INLINE_OK={B:"b",STRONG:"b",I:"i",EM:"i",BR:"br"};
function sanitizeInline(html){
  const tpl=document.createElement("template"); tpl.innerHTML=String(html||"");
  const walk=node=>{ let out="";
    node.childNodes.forEach(c=>{
      if(c.nodeType===3){ out+=esc(c.nodeValue); return; }
      if(c.nodeType!==1) return;
      const tag=INLINE_OK[c.tagName];
      if(tag==="br"){ out+="<br>"; return; }
      const fw=c.style?.fontWeight, fs=c.style?.fontStyle;
      let inner=walk(c);
      if(tag) inner=`<${tag}>${inner}</${tag}>`;
      else { if(fw==="bold"||+fw>=600) inner=`<b>${inner}</b>`; if(fs==="italic") inner=`<i>${inner}</i>`; }
      out+=inner;
    });
    return out; };
  return walk(tpl.content).replace(/(<br>)+$/,"").trim();
}
const inl=(b,x)=>b.h?sanitizeInline(x):esc(x);
const plainOf=x=>{ const d=document.createElement("div"); d.innerHTML=String(x||"").replace(/<br\s*\/?>/gi,"\n"); return d.textContent; };
const blockPlain=b=>Array.isArray(b.x)?b.x.map(v=>b.h?plainOf(v):v).join("\n"):b.t==="verse"?`${b.ref}: ${b.x||""}`:(b.h?plainOf(b.x):b.x||"");
const mdInline=(b,x)=>b.h?sanitizeInline(x).replace(/<b>(.*?)<\/b>/g,"**$1**").replace(/<i>(.*?)<\/i>/g,"*$1*").replace(/<br>/g,"  \n").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&amp;/g,"&").replace(/&quot;/g,'"').replace(/&#39;/g,"'"):x;
function blocksToMarkdown(blocks){
  return (blocks||[]).map(b=>{
    if(b.t==="h1") return "# "+mdInline(b,b.x);
    if(b.t==="h2"||b.t==="h") return "## "+mdInline(b,b.x);
    if(b.t==="h3") return "### "+mdInline(b,b.x);
    if(b.t==="ol") return b.x.map((v,i)=>`${i+1}. ${mdInline(b,v)}`).join("\n");
    if(b.t==="ul") return b.x.map(v=>`- ${mdInline(b,v)}`).join("\n");
    if(b.t==="quote") return "> "+mdInline(b,b.x);
    if(b.t==="verse") return `> ${b.x||""}\n> — ${b.ref} (KJV)`;
    return mdInline(b,b.x);
  }).join("\n\n");
}
function blocksToHTML(blocks){
  return (blocks||[]).map(b=>{
    if(["h1","h2","h3"].includes(b.t)) return `<${b.t}>${inl(b,b.x)}</${b.t}>`;
    if(b.t==="h") return `<h2>${inl(b,b.x)}</h2>`;
    if(b.t==="ol"||b.t==="ul") return `<${b.t}>${b.x.map(v=>`<li>${inl(b,v)}</li>`).join("")}</${b.t}>`;
    if(b.t==="quote") return `<blockquote>${inl(b,b.x)}</blockquote>`;
    if(b.t==="verse") return `<blockquote><p>${esc(b.x||"")}</p><cite>${esc(b.ref)} (KJV)</cite></blockquote>`;
    if(b.t==="poem") return `<p>${esc(b.x).replace(/\n/g,"<br>")}</p>`;
    return `<p>${inl(b,b.x)}</p>`;
  }).join("\n");
}
function ensureBlocks(n){
  if(n.type==="text"&&!Array.isArray(n.blocks)) n.blocks=String(n.body||"").split(/\n{2,}/).map(x=>x.trim()).filter(Boolean).map(x=>({t:"p",x:esc(x).replace(/\n/g,"<br>"),h:true}));
  return n;
}
const syncBody=n=>{ if(n.type==="text") n.body=(n.blocks||[]).map(blockPlain).join("\n\n"); };

/* ---------- Rich text editor (existing and new written notes, recorded notes) ---------- */
function blocksToEditor(blocks){
  return (blocks||[]).map((b,i)=>{
    if(b.t==="verse") return `<blockquote class="rt-verse" contenteditable="false" data-keep="${i}">${esc(b.x||"Scripture: "+b.ref)}<cite>${esc(b.ref)} · verified text, can't be edited</cite></blockquote>`;
    if(b.t==="illus") return `<p data-illus>${esc(b.x)}</p>`;
    if(b.t==="poem") return `<p data-poem>${esc(b.x).replace(/\n/g,"<br>")}</p>`;
    if(b.t==="h") return `<h2>${inl(b,b.x)}</h2>`;
    if(["h1","h2","h3"].includes(b.t)) return `<${b.t}>${inl(b,b.x)}</${b.t}>`;
    if(b.t==="quote") return `<blockquote>${inl(b,b.x)}</blockquote>`;
    if(b.t==="ol"||b.t==="ul") return `<${b.t}>${b.x.map(v=>`<li>${inl(b,v)}</li>`).join("")}</${b.t}>`;
    return `<p>${inl(b,b.x)}</p>`;
  }).join("")||"<p><br></p>";
}
function editorToBlocks(root,old){
  const blocks=[]; let loose="";
  const flush=()=>{ const x=sanitizeInline(loose); if(plainOf(x).trim()) blocks.push({t:"p",x,h:true}); loose=""; };
  root.childNodes.forEach(node=>{
    if(node.nodeType===3){ loose+=esc(node.nodeValue); return; }
    if(node.nodeType!==1) return;
    const tag=node.tagName;
    if(["B","STRONG","I","EM","SPAN","BR"].includes(tag)){ loose+=node.outerHTML; return; }
    flush();
    if(node.dataset?.keep!=null){ const ob=old[+node.dataset.keep]; if(ob) blocks.push(ob); return; }
    if(["H1","H2","H3"].includes(tag)){ const x=sanitizeInline(node.innerHTML); if(plainOf(x).trim()) blocks.push({t:tag.toLowerCase(),x,h:true}); return; }
    if(tag==="H4"){ const x=sanitizeInline(node.innerHTML); if(plainOf(x).trim()) blocks.push({t:"h3",x,h:true}); return; }
    if(tag==="UL"||tag==="OL"){ const items=[...node.querySelectorAll(":scope > li")].map(li=>sanitizeInline(li.innerHTML)).filter(v=>plainOf(v).trim()); if(items.length) blocks.push({t:tag.toLowerCase(),x:items,h:true}); return; }
    if(tag==="BLOCKQUOTE"){ const x=sanitizeInline(node.innerHTML); if(plainOf(x).trim()) blocks.push({t:"quote",x,h:true}); return; }
    if(node.hasAttribute("data-illus")){ const x=plainOf(node.innerHTML).trim(); if(x) blocks.push({t:"illus",x}); return; }
    if(node.hasAttribute("data-poem")){ const x=plainOf(node.innerHTML).trim(); if(x) blocks.push({t:"poem",x}); return; }
    const x=sanitizeInline(node.innerHTML); if(plainOf(x).trim()) blocks.push({t:"p",x,h:true});
  });
  flush();
  return blocks;
}
SCREENS.compose=({id,isNew})=>{
  const n=note(id); if(!n) return SCREENS.notes({});
  ensureBlocks(n);
  return `<div class="compose">
  <div class="cm-top"><button class="ibtn flat" data-act="cm-cancel" aria-label="${isNew?"Discard":"Cancel editing"}">${ic("x")}</button>
    <span class="cm-state" id="cmState" aria-live="polite">${isNew?"New note":"Editing"}</span>
    <button class="ibtn flat" data-act="cm-publish" aria-label="Publish to a blog">${ic("globe")}</button>

AFTER.compose=(page,p)=>{
  const n=note(p.id); if(!n) return;
  const rt=page.querySelector("#rt"), title=page.querySelector("#cmTitle"), state=page.querySelector("#cmState");
  const original=JSON.stringify({t:n.title||"",b:n.blocks||[]});
  let dirty=false;
  const fitTitle=()=>{title.style.height="auto";title.style.height=title.scrollHeight+"px"}; fitTitle();
  try{ document.execCommand("defaultParagraphSeparator",false,"p"); }catch(e){}
  const mark=()=>{ dirty=true; state.textContent="Unsaved changes"; };
  title.addEventListener("input",()=>{fitTitle();mark()});
  title.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); rt.focus(); } });
  rt.addEventListener("input",()=>{ if(!rt.firstElementChild&&!rt.textContent) rt.innerHTML="<p><br></p>"; mark(); });
  rt.addEventListener("paste",e=>{ e.preventDefault(); const html=e.clipboardData.getData("text/html"), text=e.clipboardData.getData("text/plain");
    const clean=html?editorToBlocks((()=>{const d=document.createElement("div");d.innerHTML=html;return d})(),[]):null;
    if(clean&&clean.length) document.execCommand("insertHTML",false,blocksToEditor(clean.filter(b=>!["verse","illus","poem"].includes(b.t))));
    else document.execCommand("insertText",false,text); });
  const blockOf=()=>{ const sel=getSelection(); if(!sel.rangeCount) return null; let el=sel.anchorNode; if(el?.nodeType===3) el=el.parentNode; while(el&&el!==rt&&el.parentNode!==rt) el=el.parentNode; return el&&el!==rt?el:null; };
  const inList=tag=>{ const sel=getSelection(); let el=sel.anchorNode; while(el&&el!==rt){ if(el.tagName===tag) return true; el=el.parentNode; } return false; };
  const refresh=()=>{ if(!rt.contains(getSelection().anchorNode)) return; const blk=blockOf(); const tag=blk?.tagName||"P";
    const st={bold:document.queryCommandState("bold"),italic:document.queryCommandState("italic"),h1:tag==="H1",h2:tag==="H2",h3:tag==="H3",quote:tag==="BLOCKQUOTE",ul:inList("UL"),ol:inList("OL")};
    page.querySelectorAll("[data-fmt]").forEach(b=>{ if(b.dataset.fmt in st) b.setAttribute("aria-pressed",!!st[b.dataset.fmt]); }); };
  const onSel=()=>{ if(!page.isConnected){ document.removeEventListener("selectionchange",onSel); return; } refresh(); };
  document.addEventListener("selectionchange",onSel);
  page.querySelectorAll("[data-fmt]").forEach(b=>{
    b.addEventListener("mousedown",e=>e.preventDefault());
    b.addEventListener("click",()=>{
      if(!rt.contains(getSelection().anchorNode)){ rt.focus(); const r=document.createRange(); r.selectNodeContents(rt); r.collapse(false); const s2=getSelection(); s2.removeAllRanges(); s2.addRange(r); }
      const f=b.dataset.fmt, blk=blockOf();
      if(blk&&blk.getAttribute("contenteditable")==="false"){ toast("Verified scripture can't be formatted"); return; }
      if(["bold","italic","undo","redo"].includes(f)) document.execCommand(f);
      else if(f==="ul") document.execCommand("insertUnorderedList");
      else if(f==="ol") document.execCommand("insertOrderedList");
      else { const want=f==="quote"?"BLOCKQUOTE":f.toUpperCase(); const cur=blk?.tagName; document.execCommand("formatBlock",false,cur===want?"<p>":`<${want.toLowerCase()}>`); }
      mark(); refresh();
    });
  });
  rt.addEventListener("keydown",e=>{ if((e.metaKey||e.ctrlKey)&&!e.shiftKey){ const k=e.key.toLowerCase(); if(k==="b"||k==="i"){ e.preventDefault(); document.execCommand(k==="b"?"bold":"italic"); mark(); refresh(); } } });
  const collect=()=>({title:title.value.trim(),blocks:editorToBlocks(rt,n.blocks||[])});
  const isEmpty=c=>!c.title&&!c.blocks.length;
  const commit=()=>{ const c=collect();
    if(p.isNew&&isEmpty(c)){ S.notes=S.notes.filter(x=>x!==n); save(); return null; }
    n.title=c.title; n.blocks=c.blocks; syncBody(n); n.edited=new Date().toISOString(); if(n.summary&&JSON.stringify({t:n.title,b:n.blocks})!==original) n.summaryStale=true; save(); dirty=false; return n; };
  page.querySelector('[data-act="cm-done"]').onclick=()=>{ const saved=commit(); if(!saved){ toast("Empty note discarded"); back(); return; } if(!p.isNew&&!getPlace) {} go("noteView",{id:saved.id,tab:"note"},{replace:true}); toast(p.isNew?"Note saved":"Changes saved"); if(!saved.place&&S.prefs.tagLocation) getPlace().then(v=>{ if(v){ saved.place=v; save(); } }); };
  page.querySelector('[data-act="cm-cancel"]').onclick=async()=>{
    if(p.isNew){ const c=collect(); if(isEmpty(c)){ S.notes=S.notes.filter(x=>x!==n); save(); back(); return; } }
    if(!dirty){ back(); return; }
    openModal(`<div class="modal-body"><h3>Keep your changes?</h3><p class="muted" style="margin:8px 0 18px;font-size:14.5px">You have edits that haven't been saved.</p><div style="display:grid;gap:10px"><button class="btn primary block" id="cmSave">Save changes</button><button class="btn line block" id="cmDiscard">Discard</button></div></div>`,{onOpen:b=>{
      b.querySelector("#cmSave").onclick=()=>{ closeLayer(); page.querySelector('[data-act="cm-done"]').click(); };
      b.querySelector("#cmDiscard").onclick=()=>{ closeLayer(); if(p.isNew){ S.notes=S.notes.filter(x=>x!==n); save(); } back(); };
    }});
  };
  page.querySelector('[data-act="cm-publish"]').onclick=()=>{ const c=collect(); if(isEmpty(c)){ toast("Write something before publishing"); return; } commit(); publishSheet(n,{fromEditor:true}); };
  if(p.isNew) setTimeout(()=>title.focus(),300);
};

/* ---------- Export ---------- */
function exportSheet(n){
  ensureBlocks(n);
  const md=()=>`# ${n.title||"Untitled"}\n\n${blocksToMarkdown(n.type==="list"?[{t:"ul",x:n.items.map(i=>i.t)}]:n.blocks)}\n`;
  const html=()=>`<!doctype html><meta charset="utf-8"><title>${esc(n.title||"Untitled")}</title><article><h1>${esc(n.title||"Untitled")}</h1>\n${blocksToHTML(n.type==="list"?[{t:"ul",x:n.items.map(i=>i.t)}]:n.blocks)}</article>`;
  const dl=(name,text,type)=>{ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},400); };
  const slug=(n.title||"note").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"note";
  openSheet(`<button class="ibtn flat sheet-x" data-close aria-label="Close">${ic("x")}</button><h3>Export</h3>
    <button class="menu-row" data-e="md">${ic("download")}Download Markdown (.md)</button>
    <button class="menu-row" data-e="html">${ic("download")}Download HTML (.html)</button>
    <button class="menu-row" data-e="copymd">${ic("copy")}Copy as Markdown</button>`,{onOpen:b=>{
      b.querySelector('[data-e="md"]').onclick=()=>{dl(slug+".md",md(),"text/markdown");closeLayer();toast("Markdown downloaded")};
      b.querySelector('[data-e="html"]').onclick=()=>{dl(slug+".html",html(),"text/html");closeLayer();toast("HTML downloaded")};
      b.querySelector('[data-e="copymd"]').onclick=()=>{closeLayer();copyText(md())};
    }});
}

/* ---------- AI note view (image 1 detail + travel reader) ---------- */
function blockHTML(b){
  switch(b.t){
    case "p":return `<p>${inl(b,b.x)}</p>`;
    case "h":return `<h4>${inl(b,b.x)}</h4>`;
    case "h1":return `<h1 class="rt-h1">${inl(b,b.x)}</h1>`;
    case "h2":return `<h2 class="rt-h2">${inl(b,b.x)}</h2>`;
    case "h3":return `<h3 class="rt-h3">${inl(b,b.x)}</h3>`;
    case "quote":return `<blockquote class="rt-quote">${inl(b,b.x)}</blockquote>`;
    case "ol":return `<ol>${b.x.map(i=>`<li>${inl(b,i)}</li>`).join("")}</ol>`;
    case "ul":return `<ul>${b.x.map(i=>`<li>${inl(b,i)}</li>`).join("")}</ul>`;
    case "verse":return b.x?`<blockquote class="verse">${esc(b.x)}<cite>${esc(b.ref)} (${S.prefs.translation==="KJV"?"KJV":"KJV · "+S.prefs.translation+" needs licence"})<small>Verified verse text</small></cite></blockquote>`:`<blockquote class="verse" style="font-style:normal">Scripture mentioned: <b>${esc(b.ref)}</b><cite>Look up in your Bible<small>Not in the offline verse library yet</small></cite></blockquote>`;
    case "illus":return `<div class="illus">${esc(b.x)}</div>`;
    case "poem":return `<p class="poem">${esc(b.x)}</p>`;
  }
  return "";
}

/* ---------- Reminder modal (image 5 "Create a task") ---------- */
function reminderModal(noteId,presetDate){
  const aiNotes=S.notes.filter(n=>!n.trashed&&(n.title||"").trim()).slice(0,6); if(noteId&&note(noteId)&&!aiNotes.includes(note(noteId))) aiNotes.unshift(note(noteId));

SCREENS.calendar=({y,m,d})=>{
  const now=new Date(); y=y??now.getFullYear(); m=m??now.getMonth(); d=d??now.getDate();
  const first=new Date(y,m,1), start=new Date(y,m,1-((first.getDay()+6)%7)), sel=new Date(y,m,d);
  const same=(a,b)=>a.toDateString()===b.toDateString();
  const live=S.notes.filter(n=>!n.trashed&&!n.archived);
  const on=day=>({n:live.filter(x=>same(new Date(x.date),day)),r:S.reminders.filter(x=>same(new Date(x.when),day)),m:S.meetings.filter(x=>same(new Date(x.when),day))});
  const cells=Array.from({length:42},(_,i)=>{const day=new Date(start);day.setDate(start.getDate()+i);const e=on(day);const cnt=e.n.length+e.r.length+e.m.length;
    return `<button class="cal-day${day.getMonth()!==m?" is-out":""}${same(day,now)?" is-today":""}" data-cday="${day.getFullYear()}-${day.getMonth()}-${day.getDate()}" aria-pressed="${same(day,sel)}" aria-label="${day.toDateString()}${cnt?`: ${e.n.length} notes, ${e.r.length} reminders, ${e.m.length} meetings`:""}"><span>${day.getDate()}</span><span class="cal-dots">${e.n.length?'<i class="dn"></i>':""}${e.r.length?'<i class="dr"></i>':""}${e.m.length?'<i class="dm"></i>':""}</span></button>`}).join("");
  const e=on(sel);

    ...e.m.map(x=>`<button class="agenda-row" data-act="meeting-detail" data-id="${x.id}"><i class="dm"></i><span class="grow"><b>${esc(x.title)}</b><small>${fmtTime(x.when)} · ${PLATFORM[x.platform].name}</small></span>${ic("chev")}</button>`),
    ...e.r.map(x=>`<button class="agenda-row" data-open="${x.note}"><i class="dr"></i><span class="grow"><b>${esc(x.text)}</b><small>${fmtTime(x.when)} · Reminder${x.done?" · done":""}</small></span>${ic("chev")}</button>`),
    ...e.n.map(x=>`<button class="agenda-row" data-open="${x.id}"><i class="dn"></i><span class="grow"><b>${esc(x.title||"Untitled note")}</b><small>${fmtTime(x.date)} · ${MODES[x.mode]||"Note"}${x.place?" · "+esc(x.place):""}</small></span>${ic("chev")}</button>`)
  ];
  return `<div class="top"><button class="ibtn" data-back aria-label="Back">${ic("back")}</button><h1 class="h2" style="flex:1;text-align:center">Calendar</h1><button class="ibtn" data-act="cal-today" aria-label="Go to today">${ic("clock")}</button></div>
  <div class="cal"><div class="cal-head"><button class="ibtn flat" data-mnav="-1" aria-label="Previous month">${ic("back")}</button><b>${first.toLocaleDateString("en-US",{month:"long",year:"numeric"})}</b><button class="ibtn flat" data-mnav="1" aria-label="Next month">${ic("chev")}</button></div>
    <div class="cal-grid">${["M","T","W","T","F","S","S"].map((x,i)=>`<span class="cal-dow" aria-hidden="true">${x}</span>`).join("")}${cells}</div>
    <div class="cal-legend"><span><i class="dn"></i>Notes</span><span><i class="dr"></i>Reminders</span><span><i class="dm"></i>Meetings</span></div></div>
  <div class="sec"><h2 class="h2">${sel.toLocaleDateString("en-US",{weekday:"long",month:"short",day:"numeric"})}</h2><button class="link" data-act="cal-add">Add reminder</button></div>
  ${rows.length?`<div class="agenda">${rows.join("")}</div>`:`<p class="muted" style="padding:14px var(--pad) 0">Nothing on this day.</p>`}

/* In-app call */
let callState=null;
function openCall(title="Your App call"){
  closeFullscreen();
  const people=[[S.user?.name||"You","#B34B25"],["Ada O.","#4F6690"],["Emeka N.","#6F6C25"],["Tolu A.","#8A6A1E"]];

    <div class="captions" id="caps" aria-live="polite"><b>Ada O.</b> Let's start with updates from yesterday.</div>
    <div class="call-ctrl"><button data-act="call-mic" aria-pressed="true" aria-label="Microphone">${ic("mic")}</button><button data-act="call-cam" aria-pressed="true" aria-label="Camera">${ic("video")}</button><button data-act="call-cc" aria-pressed="true" aria-label="Captions">${ic("cc")}</button><button class="end" data-act="call-end" aria-label="End call">${ic("phone",'style="transform:rotate(135deg)"')}</button></div></div>`;
  const lines=[["Ada O.","Let's start with updates from yesterday."],["Emeka N.","I finished the onboarding screens."],["Tolu A.","Today I'll start the upload flow."],["Emeka N.","My blocker is the Bible API licence."],["Ada O.","Action item: Emeka follows up by Friday."]];
  callState={t0:Date.now(),i:0,title,stream:null};
  callState.tick=setInterval(()=>{const s=Math.floor((Date.now()-callState.t0)/1000);const el=$("#callT");el&&(el.textContent=`${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`)},1000);
  callState.cap=setInterval(()=>{callState.i=(callState.i+1)%lines.length;const [who,txt]=lines[callState.i];const c=$("#caps");if(c)c.innerHTML=`<b>${who}</b> ${txt}`;$$(".tile").forEach(t=>t.classList.toggle("speaking",people[+t.dataset.tile][0]===who))},3200);
  if(navigator.mediaDevices?.getUserMedia) navigator.mediaDevices.getUserMedia({video:true,audio:true}).then(st=>{callState.stream=st;const v=$("#selfVid");if(v){v.srcObject=st;v.nextElementSibling.style.display="none"}}).catch(()=>{});
}
function endCall(){
  if(!callState) return; clearInterval(callState.tick); clearInterval(callState.cap); callState.stream?.getTracks().forEach(t=>t.stop());
  const dur=Math.max(30,Math.floor((Date.now()-callState.t0)/1000)), title=callState.title; callState=null; $("#fsLayer").innerHTML="";
  processNote({transcript:SAMPLE_SPEECH.meeting,mode:"meeting",duration:dur,title,platform:"selah"});
}

      body.innerHTML=S.posts.map(po=>{const n=note(po.note)||{title:"Shared note",mode:"text"};return `<article class="post"><div class="post-head"><span class="avatar sm">${avatarInner(personByName(po.name))}</span><div class="grow"><b>${esc(po.name)}</b><small>${po.time} ago · ${MODES[n.mode]||"Note"}</small></div><button class="ibtn flat" aria-label="Post options" data-pmore="${po.id}">${ic("more")}</button></div>
        <p>${esc(po.text)}</p>
        <button class="post-grid" data-open="${n.id||""}" style="width:100%"><div>${scene(n.mode,{h:380})}<span class="ov">${esc(n.title)}</span></div><div>${scene(["talk","class","poetry","meeting"][(po.likes)%4],{h:200})}</div><div style="background:${kc(["sand","mint","dusk","fog"][po.comments%4])};padding:10px;text-align:left;font:12px/1.4 Outfit;color:var(--ink2)">${esc((n.summary?.take||[]).slice(0,2).map(x=>"• "+x).join("\n")).replace(/\n/g,"<br>")}</div></button>
        <div class="post-actions"><button class="like" data-like="${po.id}" aria-pressed="${po.liked}" aria-label="Like">${ic("heart",'fill="currentColor"')}</button><span>${po.likes}</span><span class="grow"></span><button data-save="${po.id}" aria-pressed="${po.saved}" aria-label="Save">${ic("bookmark",po.saved?'fill="currentColor"':"")}</button><button data-comments="${po.id}" aria-label="${po.thread.length} comments">${ic("chat")}${po.thread.length}</button></div></article>`}).join("");
      const comp=document.createElement("button"); comp.className="composer"; comp.dataset.act="new-post"; comp.innerHTML=`<span class="grow">Share a note with the community</span><span class="stack"><span class="avatar xs">${avatarInner({name:"Ada Okoro"})}</span><span class="avatar xs">${avatarInner({name:"Tolu A."})}</span><span class="avatar xs">${avatarInner(me())}</span></span>`;
      page.parentElement.appendChild(comp);
    } else if(p.tab==="groups"){
      body.innerHTML=S.groups.map(g=>`<div class="group"><div class="gart">${scene(g.kind,{h:300})}</div><div class="grow"><b>${esc(g.name)}</b><small>${g.members.toLocaleString()} members · shared notes & calls</small></div><button class="btn ${g.joined?"line":"soft"} sm" data-join="${g.id}">${g.joined?"Joined":"Join"}</button></div>`).join("")+
        `<button class="folder new" style="width:calc(100% - 2*var(--pad));margin:14px var(--pad) 0;min-height:70px;flex-direction:row" data-act="new-group">${ic("plus")}Create a study group</button>`;
    } else {
      body.innerHTML=`<button class="upgrade" style="background:linear-gradient(135deg,var(--brand-soft),var(--up-b))" data-act="host-live"><svg class="ill" viewBox="0 0 72 72">${P.live.replace(/currentColor/g,"var(--brand-deep)").replace("<circle",'<circle transform="scale(3)"').replace(/<path/g,'<path stroke="var(--brand-deep)" stroke-width="1.6" fill="none" transform="scale(3)"')}</svg><span><b>Host a live session</b><small>Webinars, sermons, poetry nights. Everyone gets the notes after.</small></span></button>`+
      S.lives.map(l=>`<div class="live tint" style="--tint:${l.color}"><span class="tag"><span class="recdot" style="animation:none;background:var(--pink)"></span>${fmtShort(l.when)} · ${fmtTime(l.when)}</span><b>${esc(l.title)}</b><small>Hosted by ${esc(l.host)} · audio & video</small><div class="lfoot"><span class="stack" style="padding-left:8px"><span class="avatar xs">${avatarInner({name:l.host})}</span><span class="avatar xs">${avatarInner({name:l.id+"a"})}</span><span class="avatar xs">${avatarInner({name:l.id+"b"})}</span><span class="muted" style="font-size:12.5px;margin-left:8px;align-self:center">${l.going} going</span></span><button class="btn ${l.remind?"line":"dark"} sm" data-remind-live="${l.id}">${l.remind?"Reminder on":"Remind me"}</button></div></div>`).join("");
    }
  };
  p.tab=p.tab||"feed"; draw();
  page.querySelectorAll("[data-ctab]").forEach(b=>b.onclick=()=>{p.tab=b.dataset.ctab;draw()});
  body.addEventListener("click",e=>{
    const lk=e.target.closest("[data-like]"); if(lk){const po=S.posts.find(x=>x.id===lk.dataset.like);po.liked=!po.liked;po.likes+=po.liked?1:-1;save();draw();return;}
    const sv=e.target.closest("[data-save]"); if(sv){const po=S.posts.find(x=>x.id===sv.dataset.save);po.saved=!po.saved;save();draw();toast(po.saved?"Saved":"Removed from saved");return;}
    const j=e.target.closest("[data-join]"); if(j){const g=S.groups.find(x=>x.id===j.dataset.join);g.joined=!g.joined;g.members+=g.joined?1:-1;save();draw();toast(g.joined?`You joined ${g.name}`:`You left ${g.name}`);return;}
    const cm=e.target.closest("[data-comments]"); if(cm){commentsSheet(cm.dataset.comments,draw);return;}
    const pm=e.target.closest("[data-pmore]"); if(pm){postMenu(pm.dataset.pmore,draw);return;}
    const rl=e.target.closest("[data-remind-live]"); if(rl){const l=S.lives.find(x=>x.id===rl.dataset.remindLive);l.remind=!l.remind;save();draw();toast(l.remind?"We'll remind you before it starts":"Reminder removed");return;}
  });
};
function commentsSheet(postId,after){
  const po=S.posts.find(x=>x.id===postId); if(!po) return;
  const list=()=>po.thread.length?po.thread.map(c=>`<div class="cmt"><span class="avatar sm">${avatarInner(personByName(c.name))}</span><div style="min-width:0"><b>${esc(c.name)}<small>${c.time==="now"?"Just now":c.time}</small></b><p>${esc(c.text)}</p></div></div>`).join(""):`<p class="muted" style="padding:14px 0;font-size:14.5px">No comments yet. Start the conversation.</p>`;
  openSheet(`<button class="ibtn flat sheet-x" data-close aria-label="Close">${ic("x")}</button><h3>Comments</h3><div id="cList" style="margin-top:6px">${list()}</div>
    <div class="input" style="margin-top:12px;padding-right:6px"><input id="cText" placeholder="Add a comment" maxlength="400" enterkeyhint="send" aria-label="Add a comment"><button class="ibtn" id="cSend" aria-label="Post comment" style="width:38px;height:38px;background:var(--brand);color:#fff">${ic("send")}</button></div>`,{onOpen:b=>{
      const send=()=>{const v=b.querySelector("#cText").value.trim();if(!v)return;po.thread.push({name:S.user?.name||"You",text:v,time:"now"});save();b.querySelector("#cList").innerHTML=list();b.querySelector("#cText").value="";after&&after()};
      b.querySelector("#cSend").onclick=send; b.querySelector("#cText").onkeydown=e=>{if(e.key==="Enter")send()};
    }});
}
function postMenu(id,after){

  openSheet(`<h3>Post</h3><button class="menu-row" data-x="link">${ic("link")}Copy link</button>${mine?`<button class="menu-row danger" data-x="del">${ic("trash")}Delete post</button>`:`<button class="menu-row" data-x="hide">${ic("eyeoff")}Hide this post</button><button class="menu-row danger" data-x="report">${ic("x")}Report</button>`}`,{onOpen:b=>{
    b.querySelector('[data-x="link"]').onclick=()=>{closeLayer();copyText?copyText(`https://yourapp.com/p/${po.id}`):toast("Link copied")};
    b.querySelector('[data-x="del"]')?.addEventListener("click",()=>{S.posts=S.posts.filter(x=>x!==po);save();closeLayer();after();toast("Post deleted")});
    b.querySelector('[data-x="hide"]')?.addEventListener("click",()=>{S.posts=S.posts.filter(x=>x!==po);save();closeLayer();after();toast("Post hidden")});

}

/* ---------- Reminders (image 5) ---------- */
SCREENS.reminders=({range="today",day=0})=>{
  const days=Array.from({length:6},(_,i)=>{const d=new Date();d.setDate(d.getDate()+i-1);return d});
  const lim={today:1,tomorrow:2,week:7}[range];
  const list=S.reminders.filter(r=>{const diff=(new Date(r.when)-new Date().setHours(0,0,0,0))/864e5;return range==="tomorrow"?diff>=1&&diff<2:diff<lim});
  return `<div class="rem-top"><span class="bubble" style="width:60px;height:60px;left:-20px;top:120px;background:#DDDAAE"></span><span class="bubble" style="width:70px;height:70px;right:-24px;top:150px;background:#BCCBE2"></span><span class="bubble" style="width:16px;height:16px;left:60%;top:30px;background:#F7D89A"></span>
    <div style="display:flex;justify-content:space-between;position:relative"><button class="ibtn" data-back aria-label="Back">${ic("back")}</button><button class="ibtn" data-go="calendar" aria-label="Open calendar">${ic("cal")}</button></div>
    <div class="emblem">${ic("bell")}</div><h1>Hi, ${esc(firstName())}!</h1></div>
  <div class="row-scroll date-strip" style="margin-top:14px">${days.map((d,i)=>{const c=S.reminders.filter(r=>new Date(r.when).toDateString()===d.toDateString()).length;return `<button class="day" data-calday="${d.getFullYear()}-${d.getMonth()}-${d.getDate()}" aria-label="Open ${d.toDateString()} in calendar" aria-pressed="${i===1}"><small>${d.toLocaleDateString("en-US",{month:"short"})}</small><b>${d.getDate()}</b><small>${c} review${c===1?"":"s"}</small></button>`}).join("")}</div>
  <div class="tabs-plus">${[["today","Today"],["tomorrow","Tomorrow"],["week","Week"]].map(([k,l])=>`<button class="tab" data-rr="${k}" aria-selected="${range===k}">${l}</button>`).join("")}<button class="plus-sq" data-act="new-reminder" aria-label="Create reminder">${ic("plus")}</button></div>
  <div class="row-scroll rings" style="padding-top:18px">${list.filter(r=>!r.done).map(ringCard).join("")||`<p class="muted" style="padding:14px 0">Nothing to review ${range==="week"?"this week":range}.</p>`}</div>
  <div class="sec" style="margin-top:18px"><h2 class="h2">All reminders</h2></div>
  ${S.reminders.map(r=>`<div class="rem-row ${r.done?"done":""}"><button class="rcheck" data-rdone="${r.id}" aria-label="Mark done" aria-pressed="${r.done}">${ic("check",'stroke-width="3"')}</button><button class="grow" data-open="${r.note}" style="text-align:left"><b>${esc(r.text)}</b><div class="rtime">${fmtShort(r.when)} · ${fmtTime(r.when)}</div></button><button class="ibtn flat" data-rdel="${r.id}" aria-label="Delete reminder">${ic("trash",'style="width:18px;height:18px"')}</button></div>`).join("")}<div style="height:40px"></div>`;
};
AFTER.reminders=(page,p)=>{
  page.querySelectorAll("[data-calday]").forEach(b=>b.onclick=()=>{const [y,m,d]=b.dataset.calday.split("-").map(Number);go("calendar",{y,m,d})});
  page.querySelectorAll("[data-rr]").forEach(b=>b.onclick=()=>{p.range=b.dataset.rr;render("in")});
  page.querySelectorAll("[data-rdone]").forEach(b=>b.onclick=()=>{const r=S.reminders.find(x=>x.id===b.dataset.rdone);r.done=!r.done;if(r.done)r.progress=100;save();render("in");toast(r.done?"Nice! Review done":"Marked as not done")});
  page.querySelectorAll("[data-rdel]").forEach(b=>b.onclick=()=>{S.reminders=S.reminders.filter(x=>x.id!==b.dataset.rdel);save();render("in");toast("Reminder deleted")});
};

  return `<div class="top"><button class="ibtn" data-back aria-label="Back">${ic("back")}</button><span></span></div>

  let y=0,playing=false,last=0,sec=0,raf;const sc=$("#prS");

  $(".prompter").addEventListener("click",e=>{const a=e.target.closest("[data-act]")?.dataset.act;
    if(a==="pr-close"){playing=false;cancelAnimationFrame(raf);$("#fsLayer").innerHTML="";}
    if(a==="pr-mirror") $(".prompter").classList.toggle("mirror");

  });
}

/* =========================================================
   SHARED WAVEFORM
   ========================================================= */
function mountWave(el,getLevel){
  let bars=[],base=[],raf;
  const build=()=>{const w=el.clientWidth||300,c=Math.max(18,Math.min(72,Math.floor(w/8)));if(c===bars.length)return;el.innerHTML="";base=[];for(let i=0;i<c;i++){const t=i/(c-1);base.push((0.35+0.65*Math.sin(Math.PI*t))*(i%4===0?1:i%2===0?.62:.38));el.appendChild(document.createElement("i"))}bars=[...el.children]};
  build(); const ro=new ResizeObserver(build); ro.observe(el);
  const draw=t=>{ if(!el.isConnected){cancelAnimationFrame(raf);ro.disconnect();return;} const H=el.clientHeight||60, L=getLevel(t);
    bars.forEach((b,i)=>{ const wob=Math.abs(Math.sin(t/180+i*.9)*Math.cos(t/310+i*.37)); b.style.height=(6+base[i]*(H-6)*(L.mode==="idle"?.7:L.mode==="think"?.45*(.5+.5*Math.sin(t/220-i*.35)):Math.min(1,(.25+.75*wob)*(L.v??1))))+"px"; });
    raf=requestAnimationFrame(draw); };
  raf=requestAnimationFrame(draw);
}
function renderWords(el,text,done,fadeAll){
  const w=String(text).trim().split(/\s+/).filter(Boolean);
  el.innerHTML=w.map((x,i)=>{let c;if(fadeAll){const r=i/w.length;c=r<.45?"ink":r<.75?"near":"far"}else c=i<done?"ink":i<done+12?"near":"far";return `<span class="w ${c}">${esc(x)} </span>`}).join("");
  const box=el.closest(".speech"); if(box&&!fadeAll&&done>0&&done<9999){const cur=el.children[Math.min(done,el.children.length)-1]; if(cur&&cur.offsetTop-box.offsetTop>box.scrollTop+box.clientHeight*.6) box.scrollTop=cur.offsetTop-box.offsetTop-box.clientHeight*.4;}
}

let R=null;
function openRecorder({kind="audio",mode="talk",appendTo=null}={}){
  closeFullscreen();
  closeFab();
  $("#fsLayer").innerHTML=`<div class="fs violet" id="recr" role="dialog" aria-label="Recorder" style="grid-template-rows:auto auto auto minmax(0,1fr) auto auto">
    <div class="fs-head"><button class="ibtn glass-lg" data-r="close" aria-label="Close recorder">${ic("x")}</button><div class="fs-title" id="rTitle">New recording</div><button class="ibtn glass-lg" data-r="sample" aria-label="Use sample speech" title="Use sample speech">${ic("text")}</button></div>
    <div><div class="av-toggle" role="group" aria-label="Recording type"><button data-kind="audio" aria-pressed="${kind==="audio"}">${"Audio"}</button><button data-kind="video" aria-pressed="${kind==="video"}">Video</button></div>
      <div class="mode-row" role="group" aria-label="Note type">${["sermon","talk","class","meeting","poetry"].map(m=>`<button class="chip" data-mode="${m}" aria-pressed="${m===mode}">${MODES[m]}</button>`).join("")}</div></div>
    <p class="fs-sub" id="rSub">Tap record when you're ready</p>
    <div class="visual" id="rVisual"></div>
    <div class="speech" id="rSpeech" style="max-height:clamp(70px,16dvh,150px)"><div class="timer" id="rTime">00:00</div><div class="rec-info"><span class="gps" id="rLoc">${ic("gps")}${S.prefs.tagLocation?"Location will be added":"Location off"}</span><span id="rMarks"></span></div><p id="rWords" style="margin-top:10px;font-size:15px;text-align:center"></p></div>
    <div class="fs-controls"><button class="ibtn glass-lg" data-r="mark" aria-label="Bookmark this moment" disabled>${ic("bookmarkAdd")}</button>
      <div class="mic-ring"><button class="mic" data-r="rec" aria-label="Start recording">${ic("mic")}</button></div>
      <button class="ibtn glass-lg" data-r="stop" aria-label="Finish and create note" disabled style="color:var(--brand-deep)">${ic("check")}</button></div></div>`;
  R={kind,mode,appendTo,state:"ready",sec:0,t0:0,marks:[],text:"",interim:"",stream:null,mr:null,chunks:[],level:0,place:null,sample:false};
  const root=$("#recr");
  const drawVisual=()=>{ $("#rVisual").innerHTML= R.kind==="video" ? `<div class="rec-video"><video id="rVid" autoplay muted playsinline></video><div class="novid" id="rNoVid">${ic("video",'style="width:34px;height:34px;margin:0 auto 8px"')}Camera preview appears here</div></div><div class="wave" id="rWave" style="height:40px"></div>` : `<div class="orb-wrap" data-r="orbtap" role="button" tabindex="-1" aria-hidden="true"><div class="halo"></div><div class="orb" data-interactive></div></div><div class="wave" id="rWave"></div>`;
    mountWave($("#rWave"),()=>({mode:R.state==="rec"?"live":"idle",v:R.analyser?Math.min(1,R.level*4+.15):1}));
    if(R.kind==="video") startMedia(); };
  drawVisual();
  const orbDrive=()=>{ if(!R||!root.isConnected) return; const t=performance.now()/1000;
    const lvl=R.state!=="rec"?0:R.analyser?Math.min(1,R.level*2.4):.2+.3*Math.abs(Math.sin(t*5.1)*Math.sin(t*1.7));
    Orb.get(root.querySelector(".orb"))?.set({state:R.state==="rec"?"listening":R.state==="done"?"thinking":"idle",inputVolume:lvl}); R.orbRaf=requestAnimationFrame(orbDrive); };
  requestAnimationFrame(orbDrive);
  getPlace().then(v=>{R&&(R.place=v);const el=$("#rLoc");el&&(el.innerHTML=`${ic("gps")}${v?esc(v):S.prefs.tagLocation?"Location unavailable":"Location off"}`)});
  async function startMedia(){
    if(R.stream) return true;
    try{ R.stream=await navigator.mediaDevices.getUserMedia(R.kind==="video"?{video:{facingMode:"user"},audio:true}:{audio:true});
      if(R.kind==="video"){const v=$("#rVid");if(v){v.srcObject=R.stream;$("#rNoVid").style.display="none"}}
      try{ const ac=new (window.AudioContext||window.webkitAudioContext)(); const src=ac.createMediaStreamSource(R.stream); const an=ac.createAnalyser(); an.fftSize=256; src.connect(an); R.ac=ac; R.analyser=an; const buf=new Uint8Array(an.frequencyBinCount); const loop=()=>{ if(!R||!R.analyser) return; an.getByteTimeDomainData(buf); let m=0; for(const b of buf) m=Math.max(m,Math.abs(b-128)); R.level=m/128; requestAnimationFrame(loop); }; loop(); }catch(e){}
      return true;
    }catch(e){ return false; }
  }
  const stopMedia=()=>{R?.stream?.getTracks().forEach(t=>t.stop()); try{R?.ac?.close()}catch(e){} if(R){R.stream=null;R.analyser=null}};
  const setUI=()=>{
    root.className=`fs violet ${R.state==="rec"?"st-rec":""}`;
    const mic=root.querySelector('.mic[data-r="rec"]');
    mic.classList.toggle("rec",R.state==="rec"); mic.innerHTML=ic(R.state==="rec"?"pause":R.state==="paused"?"play":"mic");
    mic.setAttribute("aria-label",R.state==="rec"?"Pause":R.state==="paused"?"Resume":"Start recording");
    root.querySelector('[data-r="mark"]').disabled=R.state!=="rec";
    root.querySelector('[data-r="stop"]').disabled=R.state==="ready";
    $("#rSub").innerHTML=R.state==="rec"?`<span class="recdot"></span>Recording ${MODES[R.mode].toLowerCase()}${R.sample?" (sample speech)":""}`:R.state==="paused"?"Paused":"Tap record when you're ready";
    root.querySelectorAll("[data-kind]").forEach(b=>b.disabled=R.state!=="ready");
  };
  const tick=()=>{ if(!R||!root.isConnected){ teardownRecorder(); return; } if(R.state!=="rec") return; R.sec=R.base+(Date.now()-R.t0)/1000; $("#rTime").textContent=`${String(Math.floor(R.sec/60)).padStart(2,"0")}:${String(Math.floor(R.sec%60)).padStart(2,"0")}`; };
  const showText=()=>{ if(!R||!root.isConnected) return; const t=(R.text+" "+R.interim).trim(); const w=t.split(/\s+/); $("#rWords").innerHTML=t?`<span class="muted">${esc(w.slice(-24).join(" "))}</span>`:""; };
  const startSR=()=>{
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR||R.sample) return false;
    try{ const r=new SR(); R.sr=r; r.lang="en-US"; r.continuous=true; r.interimResults=true;
      r.onresult=e=>{let fin="",int="";for(let i=e.resultIndex;i<e.results.length;i++){const x=e.results[i];x.isFinal?fin+=x[0].transcript+". ":int+=x[0].transcript}R.text+=fin;R.interim=int;showText()};
      r.onend=()=>{ if(R&&R.state==="rec"&&R.sr===r){ try{r.start()}catch(e){} } };
      r.onerror=ev=>{ if(ev.error==="not-allowed"||ev.error==="service-not-allowed"){ R.sr=null; } };
      r.start(); return true; }catch(e){ return false; }
  };
  const feedSample=()=>{ R.sample=true; const words=SAMPLE_SPEECH[R.mode].split(" "); let i=R.sampleI||0; clearInterval(R.sampleT); R.sampleT=setInterval(()=>{ if(!R||!root.isConnected){ teardownRecorder(); return; } if(R.state!=="rec") return; if(i>=words.length){clearInterval(R.sampleT);return;} R.text+=(R.text?" ":"")+words[i++]; R.sampleI=i; showText(); },120); };
  const start=async()=>{
    await startMedia();
    R.state="rec"; R.base=R.sec; R.t0=Date.now(); R.clock=setInterval(tick,250);
    if(R.stream && window.MediaRecorder && !R.mr){ try{ R.mr=new MediaRecorder(R.stream); R.mr.ondataavailable=e=>e.data.size&&R.chunks.push(e.data); R.mr.start(1000); }catch(e){R.mr=null} } else if(R.mr?.state==="paused") R.mr.resume();
    if(!R.sr && !startSR() && !R.sample){ feedSample(); toast(R.stream?"Live transcription isn't available in this browser, so sample speech is used.":"Microphone not available. Using sample speech to show how notes are created."); }
    else if(R.sample) feedSample();
    setUI();
  };
  const pause=()=>{ R.state="paused"; clearInterval(R.clock); R.mr?.state==="recording"&&R.mr.pause(); const s=R.sr; R.sr=null; try{s?.stop()}catch(e){} setUI(); };
  const finish=()=>{
    const wasSR=!!R.sr; clearInterval(R.clock); clearInterval(R.sampleT); const s=R.sr; R.sr=null; try{s?.stop()}catch(e){}
    R.state="done";
    const done=()=>{ const blob=R.chunks.length?new Blob(R.chunks,{type:R.mr?.mimeType||(R.kind==="video"?"video/webm":"audio/webm")}):null;
      let transcript=(R.text+" "+R.interim).trim();
      if(!transcript){ transcript=SAMPLE_SPEECH[R.mode]; toast("No speech was picked up, so sample speech was used."); }
      else if(R.sample && R.sampleI<SAMPLE_SPEECH[R.mode].split(" ").length) transcript=SAMPLE_SPEECH[R.mode];
      const opts={transcript,mode:R.mode,duration:Math.max(1,R.sec),place:R.place,marks:R.marks,media:blob?{kind:R.kind,url:URL.createObjectURL(blob)}:null,appendTo:R.appendTo};
      stopMedia(); R=null; $("#fsLayer").innerHTML=""; processNote(opts); };
    if(R.mr && R.mr.state!=="inactive"){ R.mr.onstop=done; R.mr.stop(); } else done();
  };
  root.addEventListener("click",async e=>{
    const k=e.target.closest("[data-kind]"); if(k&&R.state==="ready"){ R.kind=k.dataset.kind; stopMedia(); root.querySelectorAll("[data-kind]").forEach(x=>x.setAttribute("aria-pressed",x===k)); drawVisual(); return; }
    const m=e.target.closest("[data-mode]"); if(m){ R.mode=m.dataset.mode; root.querySelectorAll("[data-mode]").forEach(x=>x.setAttribute("aria-pressed",x===m)); if(R.sample){R.text="";R.sampleI=0;} return; }
    let a=e.target.closest("[data-r]")?.dataset.r; if(!a) return; if(a==="orbtap"){ if(R.state==="done") return; a="rec"; }
    if(a==="close"){ if(R.state!=="ready"&&!confirm("Discard this recording?")) return; clearInterval(R.clock); clearInterval(R.sampleT); try{R.sr?.abort()}catch(err){} R.mr&&R.mr.state!=="inactive"&&R.mr.stop(); stopMedia(); R=null; $("#fsLayer").innerHTML=""; }
    if(a==="rec"){ R.state==="rec"?pause():start(); }
    if(a==="mark"){ R.marks.push(R.sec); $("#rMarks").innerHTML=`<span class="mark">${ic("bookmark",'style="width:12px;height:12px"')}${R.marks.length} bookmark${R.marks.length>1?"s":""}</span>`; toast("Moment bookmarked"); }
    if(a==="stop"){ finish(); }
    if(a==="sample"){ R.sample=true; try{R.sr?.abort()}catch(err){} R.sr=null; R.text=""; R.sampleI=0; toast(`Sample ${MODES[R.mode].toLowerCase()} speech will be used`); if(R.state==="rec") feedSample(); else start(); }
  });
  setUI();
}

/* Processing dialog (image 1 modal) */
async function processNote({transcript,mode,duration,place,marks=[],media=null,title=null,platform=null,appendTo=null}){
  const steps=["Transcribing speech","Removing greetings and fillers","Finding paragraphs and lists",mode==="sermon"||/\d+\s*(:|verse)/i.test(transcript)?"Checking scripture":"Writing a title","Adding date and location"];
  openModal(`<div class="proc-art">${scene(mode,{h:340})}</div><div class="modal-body" style="text-align:center"><h3>Organizing your note</h3><p class="muted" style="font-size:14px;margin-top:6px">You can close the app. We'll notify you when it's ready.</p>
    <ul class="steps" id="steps">${steps.map(s=>`<li><i>${ic("check",'stroke-width="3"')}</i>${s}</li>`).join("")}</ul>
    <button class="btn primary block" id="procGo" disabled>Open note</button></div>`,{dismiss:false});
  layer.dataset.dismiss="0";
  const lis=[...layerBody.querySelectorAll("#steps li")];
  let result=null;
  const work=(async()=>{
    const sample=await getSample();
    if(sample && mode!=="poetry"){ try{ const r=await sample.json(`Turn this spoken ${MODES[mode]} transcript into study notes for reading later. Remove greetings, fillers, crowd interaction, repetition. Use paragraphs for connected ideas and lists for enumerated or parallel points. Detect Bible references but NEVER write verse text. Return JSON only: {"title": string, "blocks": [{"t":"p"|"h"|"ol"|"ul"|"illus","x": string or string[]} or {"t":"verse","ref":"Book C:V"}]}.\n\nTRANSCRIPT:\n${transcript}`,{modelTier:"default"}); if(r?.blocks?.length){ r.blocks=r.blocks.map(b=>b.t==="verse"?{t:"verse",ref:b.ref,x:KJV[b.ref]||""}:b); result=r; } }catch(e){} }
    if(!result) result=structure(transcript,mode);
  })();
  for(let i=0;i<lis.length;i++){ lis[i].className="doing"; await new Promise(r=>setTimeout(r,650)); lis[i].className="done"; }
  await work;
  const placeV=place||(await getPlace())||null;
  let n;
  if(appendTo&&note(appendTo)){ n=note(appendTo); const add=result.blocks; if(n.type==="text"){ ensureBlocks(n); n.blocks=[...n.blocks,...add]; syncBody(n); } else if(n.type==="list"){ add.flatMap(b=>Array.isArray(b.x)?b.x:[b.x||b.ref]).forEach(t=>n.items.push({t,done:false})); } else { n.blocks=[...(n.blocks||[]),...add]; } }
  else { n={id:uid(),type:"ai",mode,title:title||result.title,author:S.user?.name?"You":"You",date:new Date().toISOString(),place:placeV,duration,color:"default",pinned:false,labels:[],blocks:result.blocks,transcript,bookmarks:marks,media,platform}; if(S.prefs.autoGen) n.summary=autoSummary(result.blocks); S.notes.unshift(n); }
  const persist={...n}; if(persist.media) persist.media={kind:persist.media.kind};
  save();
  S.notifs.unshift({ic:"sparkle",c:"#FBE4D9",fg:"#B34B25",t:"Your note is ready",s:`'${n.title}' · ${fmtDur(duration)}${placeV?" · "+placeV:""}`,unread:true,note:n.id});
  try{ if("Notification" in window && Notification.permission==="granted" && document.hidden) new Notification("Your note is ready",{body:n.title}); }catch(e){}
  const btn=layerBody.querySelector("#procGo"); if(btn){ btn.disabled=false; btn.onclick=()=>{ layer.dataset.dismiss="1"; closeLayer(); openNote(n); }; btn.focus(); }
}

/* Upload a file */
function uploadFile(){
  const inp=document.createElement("input"); inp.type="file"; inp.accept="audio/*,video/*";
  inp.onchange=()=>{ const f=inp.files[0]; if(!f) return;
    const kind=f.type.startsWith("video")?"video":"audio"; const url=URL.createObjectURL(f);
    const el=document.createElement(kind); el.preload="metadata"; el.src=url;
    const pickMode=dur=>openSheet(`<h3>What is this recording?</h3><p class="muted" style="font-size:14.5px;margin:6px 0 14px">${esc(f.name)} · ${fmtDur(dur)}</p><div class="chips">${["sermon","talk","class","meeting","poetry"].map((m,i)=>`<button class="chip" data-um="${m}" aria-pressed="${i===1}">${MODES[m]}</button>`).join("")}</div>
      <p class="muted" style="font-size:13px;margin-top:14px;line-height:1.45">Transcribing uploaded files needs the Your App server. In this demo, sample speech for the chosen type is used.</p>
      <button class="btn primary block" style="margin-top:16px" id="uGo">${ic("sparkle")}Create note</button>`,{onOpen:b=>{let m="talk";b.querySelectorAll("[data-um]").forEach(c=>c.onclick=()=>{m=c.dataset.um;b.querySelectorAll("[data-um]").forEach(x=>x.setAttribute("aria-pressed",x===c))});
        b.querySelector("#uGo").onclick=()=>{closeLayer();setTimeout(()=>processNote({transcript:SAMPLE_SPEECH[m],mode:m,duration:dur||60,media:{kind,url}}),350)};}});
    el.onloadedmetadata=()=>pickMode(isFinite(el.duration)?el.duration:60); el.onerror=()=>pickMode(60);
  };
  inp.click();
}

  let t0=performance.now(); const tick=()=>{ if(!b.isConnected||!layer.classList.contains("open")) return; const t=(performance.now()-t0)/1000;
    b.querySelectorAll(".op .orb").forEach((el,i)=>Orb.get(el)?.set({state:"speaking",outputVolume:.35+.3*Math.abs(Math.sin(t*2.2+i))}));
    const demo=b.querySelector("#orbDemo"); if(demo){ const st=b.querySelector("[data-ps][aria-selected=true]")?.dataset.ps||"listening"; const v=.3+.45*Math.abs(Math.sin(t*3.1)*Math.cos(t*1.7)); Orb.get(demo)?.set({state:st,inputVolume:v,outputVolume:v}); Orb.get(demo)?.setTheme(S.prefs.orbTheme); }
    requestAnimationFrame(tick); }; requestAnimationFrame(tick);
  b.querySelectorAll("[data-ps]").forEach(x=>x.onclick=()=>b.querySelectorAll("[data-ps]").forEach(y=>y.setAttribute("aria-selected",y===x)));
}
const orbPickHTML=()=>`<div class="orb-pick" role="group" aria-label="Orb style">${ORB_THEMES.map(([k,l])=>`<button data-ot="${k}" aria-pressed="${S.prefs.orbTheme===k}"><span class="op"><span class="orb" data-theme="${k}"></span></span>${l}</button>`).join("")}</div>`;
function orbSettingsSheet(){
  openSheet(`<button class="ibtn flat sheet-x" data-close aria-label="Close">${ic("x")}</button><h3>Assistant orb</h3><p class="muted" style="font-size:14px;margin-top:4px">Tap or drag the orb to play with it.</p>
    <div class="orb-demo"><div class="orb" id="orbDemo" data-interactive data-orb-follow></div></div>
    <div class="seg" role="group" aria-label="Preview state">${[["idle","Idle"],["listening","Listen"],["thinking","Think"],["speaking","Speak"],["error","Error"]].map(([k,l])=>`<button data-ps="${k}" aria-selected="${k==="listening"}">${l}</button>`).join("")}</div>
    ${orbPickHTML()}

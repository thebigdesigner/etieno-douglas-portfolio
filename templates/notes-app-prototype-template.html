    <div class="seg" role="group" aria-label="Orb response">${[["calm","Calm"],["balanced","Balanced"],["expressive","Expressive"]].map(([k,l])=>`<button data-preset="${k}" aria-selected="${S.prefs.orbPreset===k}">${l}</button>`).join("")}</div>`,{onOpen:b=>{
      orbPicker(b);
      b.querySelectorAll("[data-preset]").forEach(x=>x.onclick=()=>{S.prefs.orbPreset=x.dataset.preset;save();b.querySelectorAll("[data-preset]").forEach(y=>y.setAttribute("aria-selected",y===x))});
      if(route.name==="profile") layer.addEventListener("transitionend",()=>{},{once:true});
    }});
}



/* =========================================================
   ILLUSTRATED AVATARS (used when someone has no photo)
   ========================================================= */
const AV_BG=["#DCE6F4","#FBE6BD","#E4E2BE","#F9D9CB","#E3E7EF","#F3E3D0"];
const AV_SKIN=["#F6D3B3","#E8B48C","#C98B5E","#A0673F","#7A4B2E","#553421"];
const AV_HAIR=["#1E1916","#3A2A20","#5E4030","#8C5A35","#C99A5B","#2B2B2B"];
const AV_TOP=["#415A8C","#DF6D41","#6F6C25","#E0B45F","#2F343D","#8DA6CC"];
const AV_WRAP=["#DF6D41","#415A8C","#AAA648","#E0B45F"];
function hashStr(t){ let h=2166136261; for(const c of String(t||"?")) { h^=c.charCodeAt(0); h=Math.imul(h,16777619); } return h>>>0; }
function avatarSVG(seed){
  const h=hashStr(seed), pick=(a,k)=>a[(h>>>k)%a.length];
  const bg=pick(AV_BG,0), skin=pick(AV_SKIN,3), hair=pick(AV_HAIR,7), top=pick(AV_TOP,11), style=(h>>>15)%6, wrap=pick(AV_WRAP,19), glasses=((h>>>21)%5)===0;
  let back="", front="";
  if(style===0) front=`<path d="M19 27c0-9 6-15 13-15s13 6 13 15c-2-4-6-7-13-7s-11 3-13 7z" fill="${hair}"/>`;                                   // short crop
  if(style===1) { back=`<circle cx="32" cy="23" r="15" fill="${hair}"/>`; front=`<path d="M18.5 26c1-8 6-13 13.5-13s12.5 5 13.5 13c-3-3-8-5-13.5-5s-10.5 2-13.5 5z" fill="${hair}"/>`; } // afro
  if(style===2) { back=`<path d="M16 28c0-11 7-18 16-18s16 7 16 18v14c-3 2-6 3-9 3V30H25v15c-3 0-6-1-9-3z" fill="${hair}"/>`; front=`<path d="M19.5 27c1-8 6-13 12.5-13s11.5 5 12.5 13c-4-3-8-5-12.5-5s-8.5 2-12.5 5z" fill="${hair}"/>`; } // long
  if(style===3) { front=`<path d="M17 26c0-10 7-16 15-16s15 6 15 16c-4-2-9-3-15-3s-11 1-15 3z" fill="${wrap}"/><path d="M40 12c5-2 9 1 8 5-3-1-5-1-8 1z" fill="${wrap}"/><path d="M17 26c4-2 9-3 15-3s11 1 15 3" stroke="rgba(0,0,0,.15)" stroke-width="1.2" fill="none"/>`; } // head wrap
  if(style===4) { back=`<circle cx="32" cy="10" r="6" fill="${hair}"/>`; front=`<path d="M19.5 27c0-8 5.5-14 12.5-14s12.5 6 12.5 14c-3-4-7-6-12.5-6s-9.5 2-12.5 6z" fill="${hair}"/>`; } // bun
  if(style===5) front=`<path d="M20 22c2-6 7-9 12-9s10 3 12 9c-3-2-7-3-12-3s-9 1-12 3z" fill="${hair}" opacity=".85"/>`;                   // close cut
  const eyes=`<circle cx="27.5" cy="29" r="1.5" fill="#1E1916"/><circle cx="36.5" cy="29" r="1.5" fill="#1E1916"/><path d="M28.5 35c2.2 1.6 4.8 1.6 7 0" stroke="#1E1916" stroke-width="1.4" stroke-linecap="round" fill="none" opacity=".75"/>`;
  const specs=glasses?`<g fill="none" stroke="#1E1916" stroke-width="1.2" opacity=".8"><circle cx="27.5" cy="29" r="3.6"/><circle cx="36.5" cy="29" r="3.6"/><path d="M31.1 29h1.8"/></g>`:"";
  return `<svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" fill="${bg}"/>${back}<path d="M12 64c1-12 9-19 20-19s19 7 20 19z" fill="${top}"/><path d="M27 41h10v6c-2 2-8 2-10 0z" fill="${skin}"/><ellipse cx="32" cy="29" rx="12" ry="13" fill="${skin}"/>${front}${eyes}${specs}</svg>`;
}
function avatarInner(p){ p=p||{}; return p.photo?`<img src="${p.photo}" alt="">`:avatarSVG(p.avatar||p.name||"You"); }
const me=()=>({name:S.user?.name||"You",photo:S.user?.photo,avatar:S.user?.avatar});
const personByName=name=>name===(S.user?.name||"You")?me():{name};


/* =========================================================
   THEME: light / dark / system + accent colour
   ========================================================= */
const ACCENTS={
  sky:{name:"Blue",light:{brand:"#8DA6CC",deep:"#415A8C",soft:"#E8EEF7",softer:"#F3F6FB",line:"#B9C9E2",a:"#4F6A9E",b:"#3A5282",on:"#FFFFFF",rgb:"65,90,140"},dark:{brand:"#8DA6CC",deep:"#AFC2E0",soft:"#2B3340",softer:"#262C35",line:"#4F6690",a:"#B4C6E2",b:"#8DA6CC",on:"#14181F",rgb:"141,166,204"},orb:["#6F8DC0","#C9D8EE","#F7D89A"],sw:"#5E7DB3"},
  canyon:{name:"Canyon",light:{brand:"#DF6D41",deep:"#A3421C",soft:"#FBE4D9",softer:"#FDF3EE",line:"#F2C2AC",a:"#BF552D",b:"#9C3F1A",on:"#FFFFFF",rgb:"163,66,28"},dark:{brand:"#DF6D41",deep:"#F2A585",soft:"#3A2A23",softer:"#302622",line:"#8A4A2E",a:"#F2A585",b:"#DF6D41",on:"#1B1310",rgb:"223,109,65"},orb:["#DF6D41","#F7D89A","#8DA6CC"],sw:"#DF6D41"},
  olive:{name:"Olive",light:{brand:"#AAA648",deep:"#5F5C1E",soft:"#EFEED9",softer:"#F7F7EC",line:"#D6D39E",a:"#6F6C25",b:"#55531C",on:"#FFFFFF",rgb:"95,92,30"},dark:{brand:"#AAA648",deep:"#D3D094",soft:"#33331F",softer:"#2C2C21",line:"#6F6C25",a:"#D3D094",b:"#AAA648",on:"#191A0E",rgb:"170,166,72"},orb:["#8E8A34","#E4E2A8","#8DA6CC"],sw:"#AAA648"},
  graphite:{name:"Graphite",light:{brand:"#5B6270",deep:"#2F343D",soft:"#ECEEF1",softer:"#F5F6F8",line:"#C9CDD4",a:"#3A404B",b:"#262A31",on:"#FFFFFF",rgb:"47,52,61"},dark:{brand:"#9AA1AD",deep:"#D6DAE0",soft:"#333333",softer:"#2D2D2D",line:"#5B6270",a:"#D6DAE0",b:"#B5BBC5",on:"#15171A",rgb:"154,161,173"},orb:["#5B6270","#C7CCD5","#8DA6CC"],sw:"#3A404B"}
};
const darkMQ=window.matchMedia?matchMedia("(prefers-color-scheme: dark)"):null;
const effectiveMode=()=>S.prefs.mode==="system"?(darkMQ&&darkMQ.matches?"dark":"light"):S.prefs.mode;
function applyTheme(){
  const mode=effectiveMode(), acc=ACCENTS[S.prefs.accent]||ACCENTS.sky, t=acc[mode], root=document.documentElement, st=root.style;
  root.dataset.theme=mode;
  st.setProperty("--brand",t.brand); st.setProperty("--brand-deep",t.deep); st.setProperty("--brand-soft",t.soft); st.setProperty("--brand-softer",t.softer);
  st.setProperty("--brand-line",t.line); st.setProperty("--grad-a",t.a); st.setProperty("--grad-b",t.b); st.setProperty("--on-brand",t.on); st.setProperty("--brand-rgb",t.rgb);
  document.querySelector('meta[name="theme-color"]')?.setAttribute("content",mode==="dark"?"#1E1E1E":"#FFFFFF");
  if(typeof Orb!=="undefined") Orb.refreshPalette();
}
darkMQ?.addEventListener?.("change",()=>{ if(S.prefs.mode==="system") applyTheme(); });

/* ---------- Appearance screen ---------- */
const modeMock=m=>{const d=m==="dark"; const bg=d?"#1E1E1E":"#FFFFFF", card=d?"#2E2E2E":"#EEF2F8", bar=d?"#8DA6CC":"#415A8C";
  return `<span class="mock" style="background:${bg}"><i style="top:12%;background:${card};height:14%"></i><i style="top:32%;background:${card}"></i><i style="top:46%;background:${card};right:34%"></i><i style="bottom:10%;left:32%;right:32%;height:10%;border-radius:99px;background:${bar}"></i></span>`;};
SCREENS.appearance=()=>{
  const pr=S.prefs;
  const sysMock=`<span class="mock" style="background:linear-gradient(90deg,#FFFFFF 50%,#1E1E1E 50%)"><i style="top:12%;height:14%;background:linear-gradient(90deg,#EEF2F8 50%,#2E2E2E 50%)"></i><i style="top:32%;background:linear-gradient(90deg,#EEF2F8 50%,#2E2E2E 50%)"></i><i style="bottom:10%;left:32%;right:32%;height:10%;border-radius:99px;background:linear-gradient(90deg,#415A8C 50%,#8DA6CC 50%)"></i></span>`;
  return `<div class="top"><button class="ibtn" data-back aria-label="Back">${ic("back")}</button><h1 class="h2" style="flex:1;text-align:center">Appearance</h1><span style="width:44px"></span></div>
  <p class="appr-h" id="lblMode">Theme</p>
  <div class="mode-grid" role="radiogroup" aria-labelledby="lblMode">
    ${[["light","Light","White and blue",modeMock("light")],["dark","Dark","Soft black",modeMock("dark")],["system","System","Match your phone",sysMock]].map(([k,l,d,m])=>`<button class="mode-tile" role="radio" data-mode="${k}" aria-checked="${pr.mode===k}">${m}${l}<small>${d}</small></button>`).join("")}
  </div>
  <p class="appr-h" id="lblAcc">Accent colour</p>
  <div class="accent-row" role="radiogroup" aria-labelledby="lblAcc">${Object.entries(ACCENTS).map(([k,a])=>`<button class="accent-sw" role="radio" data-accent="${k}" aria-checked="${pr.accent===k}"><i style="background:${a.sw}">${ic("check",'stroke-width="3"')}</i>${a.name}</button>`).join("")}</div>
  <p class="appr-h">Assistant orb</p>
  <div class="appr-card"><div class="orb-demo"><div class="orb" id="orbDemo" data-interactive></div></div>
    <div class="seg" role="group" aria-label="Preview state">${[["idle","Idle"],["listening","Listen"],["thinking","Think"],["speaking","Speak"],["error","Error"]].map(([k,l])=>`<button data-ps="${k}" aria-selected="${k==="listening"}">${l}</button>`).join("")}</div>
    ${orbPickHTML()}
    <p style="font-size:14px;font-weight:500;margin:16px 0 8px">Response</p>
    <div class="seg" role="group" aria-label="Orb response">${[["calm","Calm"],["balanced","Balanced"],["expressive","Expressive"]].map(([k,l])=>`<button data-preset="${k}" aria-selected="${pr.orbPreset===k}">${l}</button>`).join("")}</div></div>
  <div style="height:40px"></div>`;
};
AFTER.appearance=(page)=>{
  page.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{S.prefs.mode=b.dataset.mode;save();applyTheme();page.querySelectorAll("[data-mode]").forEach(x=>x.setAttribute("aria-checked",x===b));toast(`${b.dataset.mode==="system"?"Following your phone's theme":b.dataset.mode==="dark"?"Dark theme on":"Light theme on"}`)});
  page.querySelectorAll("[data-accent]").forEach(b=>b.onclick=()=>{S.prefs.accent=b.dataset.accent;save();applyTheme();page.querySelectorAll("[data-accent]").forEach(x=>x.setAttribute("aria-checked",x===b))});
  page.querySelectorAll("[data-preset]").forEach(x=>x.onclick=()=>{S.prefs.orbPreset=x.dataset.preset;save();page.querySelectorAll("[data-preset]").forEach(y=>y.setAttribute("aria-selected",y===x))});
  const t0=performance.now();
  page.querySelectorAll("[data-ot]").forEach(x=>x.onclick=()=>{S.prefs.orbTheme=x.dataset.ot;save();Orb.setThemeAll(S.prefs.orbTheme);page.querySelectorAll("[data-ot]").forEach(y=>y.setAttribute("aria-pressed",y===x))});
  page.querySelectorAll("[data-ps]").forEach(x=>x.onclick=()=>page.querySelectorAll("[data-ps]").forEach(y=>y.setAttribute("aria-selected",y===x)));
  const tick=()=>{ if(!page.isConnected) return; const t=(performance.now()-t0)/1000;
    page.querySelectorAll(".op .orb").forEach((el,i)=>Orb.get(el)?.set({state:"speaking",outputVolume:.35+.3*Math.abs(Math.sin(t*2.2+i))}));
    const d=page.querySelector("#orbDemo"); const st=page.querySelector("[data-ps][aria-selected=true]")?.dataset.ps||"listening"; const v=.3+.45*Math.abs(Math.sin(t*3.1)*Math.cos(t*1.7));
    const o=Orb.get(d); if(o){ o.setTheme(S.prefs.orbTheme); o.set({state:st,inputVolume:v,outputVolume:v}); }
    requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
};

/* ---------- Profile picture ---------- */
function resizeImage(file,max=320){
  return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onerror=rej; fr.onload=()=>{ const img=new Image(); img.onerror=rej; img.onload=()=>{ const sz=Math.min(img.width,img.height); const c=document.createElement("canvas"); c.width=c.height=max; const x=c.getContext("2d"); x.drawImage(img,(img.width-sz)/2,(img.height-sz)/2,sz,sz,0,0,max,max); res(c.toDataURL("image/jpeg",.85)); }; img.src=fr.result; }; fr.readAsDataURL(file); });
}
function avatarSheet(){
  const u=S.user; if(!u) return;
  const seeds=Array.from({length:12},(_,i)=>`${u.name}#${i}`);
  const draw=b=>{ b.querySelector("#avPrev").innerHTML=avatarInner(me()); b.querySelector("#avRemove").hidden=!u.photo; b.querySelectorAll("[data-seed]").forEach(x=>x.setAttribute("aria-pressed",!u.photo&&(u.avatar||u.name)===x.dataset.seed)); };
  openSheet(`<button class="ibtn flat sheet-x" data-close aria-label="Close">${ic("x")}</button><h3>Profile picture</h3>
    <div class="av-hero"><span class="avatar" id="avPrev"></span></div>
    <div style="display:flex;gap:10px"><button class="btn primary" style="flex:1" id="avUpload">${ic("upload")}Upload photo</button><button class="btn line" id="avRemove" style="flex:1">${ic("trash")}Remove photo</button></div>
    <p style="font-size:14px;font-weight:500;margin:18px 0 0">Or choose an illustration</p>
    <div class="av-pick">${[u.name,...seeds.slice(1)].map(sd=>`<button data-seed="${esc(sd)}" aria-label="Illustrated avatar">${avatarSVG(sd)}</button>`).join("")}</div>
    <input type="file" accept="image/*" id="avFile" hidden>`,{onOpen:b=>{
      draw(b);
      b.querySelector("#avUpload").onclick=()=>b.querySelector("#avFile").click();
      b.querySelector("#avFile").onchange=async e=>{ const f=e.target.files[0]; if(!f) return; if(!f.type.startsWith("image/")){toast("Choose an image file");return;} try{ u.photo=await resizeImage(f); save(); draw(b); rerenderAvatars(); toast("Profile photo updated"); }catch(err){ toast("Couldn't read that image. Try another one."); } };
      b.querySelector("#avRemove").onclick=()=>{ delete u.photo; save(); draw(b); rerenderAvatars(); toast("Photo removed. Showing your illustration."); };
      b.querySelectorAll("[data-seed]").forEach(x=>x.onclick=()=>{ delete u.photo; u.avatar=x.dataset.seed; save(); draw(b); rerenderAvatars(); });
    }});
}
function rerenderAvatars(){ if(["profile","home","notes","community"].includes(route.name)){ const y=stage.firstElementChild?.scrollTop||0; render("none"); stage.firstElementChild.scrollTop=y; } }
